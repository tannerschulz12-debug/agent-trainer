{lv:1,who:"Roofer",obj:"That's way too expensive for a guy my size.",pts:[["Don't argue, get curious",["fair","understand","totally","hear you"]],["Start small with one agent",["one agent","pilot","start small","just invoic"]],["Tie it to money they lose now",["late invoice","unpaid","estimate","lose","sitting"]],["Month-to-month, no trap",["month-to-month","cancel","no contract","no long"]]],model:"Totally fair. We don't have to start with everything, just one agent on your biggest headache, like chasing late invoices. If that brings in money faster than it costs, great. If not, it's month-to-month and you cancel."},
{lv:1,who:"Real estate agent",obj:"I'm slammed right now. Call me after the busy season.",pts:[["Respect their time",["respect","busy","understand","get it"]],["Busy season is when leads slip",["busy season","slip","miss","leads","slow reply"]],["Tiny next step",["10 minutes","15 minutes","quick","short"]],["Set a real date",["date","calendar","book","monday","next week"]]],model:"I get it, and I won't take much of your time. Busy season is usually when leads slip through, so that's when this helps most. Could we do a quick 15 minutes next week, or should I put a date on the calendar for after?"},
{lv:1,who:"Plumber",obj:"My wife does all the books. She'd have to decide.",pts:[["Respect her role",["great","makes sense","respect","smart"]],["Include her directly",["both","together","her too","with her","join"]],["She's the one it helps",["books","invoic","save her","her time","hours"]],["Offer a specific time",["evening","tomorrow","time","when","call"]]],model:"That makes sense, she knows the books better than anyone. Honestly she's the person this saves the most time for. Could I show you both together for 15 minutes? What evening works for her?"},
{lv:1,who:"Painter",obj:"Can you just email me a brochure?",pts:[["Say yes",["sure","happy to","glad","absolutely"]],["Ask a question so it's relevant",["question","biggest","what's","which part"]],["Make it about their business",["your business","for you","your shop","tailor"]],["Book a follow-up",["call","follow up","walk through","thursday","friday"]]],model:"Sure, happy to. So I send the right thing, what eats most of your office time right now, invoices or chasing estimates? I'll send something just for that, and can I call Thursday to walk you through it?"},
{lv:1,who:"Solo real estate agent",obj:"I don't want a robot texting my clients.",pts:[["Agree with the instinct",["agree","good instinct","fair","right"]],["It only drafts, you approve",["draft","approve","nothing goes","your okay"]],["Sounds like you",["your voice","sound like","your words","edit"]],["You stay the face",["relationship","you're the one","your clients","personal"]]],model:"Good instinct, and I agree. It's built so it can only draft; nothing goes out until you approve it. You can edit every message so it sounds like you, and your clients still hear from you, just faster."},

// ---- Level 2 ----
{lv:2,who:"Electrician",obj:"My office manager already handles all of this.",pts:[["Respect the office manager",["great","lucky","good office","valuable"]],["It helps them, not replaces them",["help","not replace","alongside","her desk","his desk"]],["Takes the repetitive stuff",["repetitive","boring","reminder","sorting","chasing"]],["Ask what they'd do with the time",["more time","free up","what would","bigger"]]],model:"That's great, a good office manager is gold. This doesn't replace them. It does the repetitive stuff like reminder drafts and sorting email, so they just approve and move on. What would they do with an extra few hours a week?"},
{lv:2,who:"Real estate team lead",obj:"We already have Follow Up Boss. It does follow-up.",pts:[["Keep their tool",["keep","good tool","great","already"]],["Ask where follow-up still breaks",["where","break","drop","still","miss"]],["Fill the gap, not replace",["missing","between","works with","on top","alongside"]],["Owner approves",["approve","draft","review"]]],model:"Keep it, it's a good tool. Can I ask where follow-up still breaks for your team? Usually it's the reply that needs real context. That's where I'd add drafts your agents approve, working alongside Follow Up Boss, not replacing it."},
{lv:2,who:"Landscaper",obj:"I'm not signing a year-long contract.",pts:[["Agree",["agree","good","neither","fair"]],["Month-to-month",["month-to-month","monthly","month to month"]],["Cancel anytime",["cancel","walk away","anytime","any time"]],["Paid pilot first",["pilot","prove","first agent","one agent"]]],model:"Good, I don't do those either. It's month-to-month, so you can cancel anytime. We start with a paid pilot on one agent so you see if it's worth it before adding anything."},
{lv:2,who:"HVAC owner",obj:"What if it sends something dumb to a customer?",pts:[["Validate the worry",["fair","valid","good question","understand"]],["Built to draft only",["draft","only draft","nothing goes out"]],["You approve every message",["approve","review","your okay","until you"]],["Pause anytime",["pause","turn off","stop","edit"]]],model:"Fair question. It's built so it can only draft; nothing goes out until you approve it. If a draft is off, you edit it or toss it, and you can pause any agent anytime."},
{lv:2,who:"Real estate agent",obj:"My business partner and I decide together, and he's out this week.",pts:[["That's reasonable",["makes sense","reasonable","of course","fair"]],["Ask what he'll care about",["care about","worried","asking","question"]],["Offer a short call with both",["both","together","join","three of us"]],["Pin a date",["next week","monday","tuesday","date","when"]]],model:"Makes sense, you should decide together. What do you think he'll care about most, cost or how it touches your clients? Let's grab 15 minutes with both of you when he's back. Does next Tuesday work?"},

// ---- Level 3 ----
{lv:3,who:"Remodeler",obj:"You're 20. What happens when you get a real job somewhere?",pts:[["Take it seriously",["fair","good question","serious","understand"]],["This is the job",["this is my","full focus","building this","my business"]],["Your data stays yours",["your data","stays","quickbooks","your accounts","lock"]],["Documented, month-to-month",["document","written","month-to-month","cancel"]]],model:"Fair question. This is the job, it's the business I'm building. Either way, your records stay in your own QuickBooks and email, I delete my copy if you cancel, the setup is documented, and it's month-to-month, so you're never stuck with me."},
{lv:3,who:"Brokerage operations manager",obj:"Where does our client data actually live?",pts:[["Most data stays in their tools",["stays","your crm","your email","quickbooks","your accounts"]],["Private dashboard behind a login",["private","login","gate","not public"]],["Only the access it needs",["only","permission","minimum","need"]],["AI provider processes it (no training, limited retention)",["provider","claude","model","train","retention","30 days"]],["Offer to walk through it",["walk","show","document","write up"]]],model:"Most of it stays where it is now, in your CRM, email and books. The dashboard is private behind a login gate, and each agent only gets the access it needs. When an agent drafts something, the AI provider processes that text under business terms: no training on your data, and only a short retention window, which I'll show you in writing. Happy to walk your team through exactly what's stored and where."},
{lv:3,who:"Concrete contractor",obj:"Fifteen hundred for setup? For what, a few hours of your time?",pts:[["Explain the work",["connect","test","build","rules","profile"]],["It's built around their business",["your prices","your terms","your business","custom"]],["Tie to payback",["pay for","payback","late invoice","one job","worth"]],["Lower-cost start",["pilot","one agent","smaller","start"]]],model:"It's more than a few hours. I connect your accounts, set it up with your prices and terms, and test it on real situations before it touches anything. If it gets one late invoice paid sooner, it usually covers itself. We can also start with one agent to keep it smaller."},
{lv:3,who:"HVAC office manager",obj:"So is this going to replace me?",pts:[["Direct answer: no",["not going to","not replace","not here to"]],["You become the approver",["approve","you decide","your call","in charge"]],["Takes the tedious work",["tedious","repetitive","reminder","sorting","chasing"]],["Makes you look good",["look good","more time","bigger","important"]]],model:"No. You're the one who approves everything, so you're in charge of it. It takes the tedious stuff like reminder drafts and sorting email, so you get time back for the work that actually needs you."},
{lv:3,who:"Real estate team lead",obj:"We tried an AI tool last year and nobody on the team used it.",pts:[["Ask why it failed",["what happened","reason","didn't stick","what made"]],["Fits their routine",["phone","inbox","where you already","routine","workflow"]],["One agent, one pain",["one agent","one problem","start small","pilot"]],["Measure use",["track","measure","check in","numbers"]]],model:"That's common. What made it not stick? Usually it's one more app nobody opens. I'd start with one agent on one pain, put the drafts where your team already works, and check in on the numbers so we know if they're using it."},

// ---- Level 4 ----
{lv:4,who:"GC (general contractor)",obj:"Show me a customer who's already using this.",pts:[["Be honest: none yet",["honest","not yet","no customers","first"]],["Lower the risk instead",["pilot","month-to-month","cancel","small"]],["Show it working",["demo","show","test","sandbox"]],["Agree on success numbers",["measure","success","numbers","goal"]]],model:"I'll be honest, I don't have customers to point to yet. That's why I start with a paid pilot on one agent, month-to-month. I'll show it working on test data first, and we agree up front on the numbers that would make it worth keeping."},
{lv:4,who:"GC (general contractor)",obj:"I'm not handing some kid the keys to my QuickBooks.",pts:[["Respect it",["fair","respect","understand","smart"]],["You connect it yourself",["you connect","you log in","your login","approve access","oauth"]],["You can cut access anytime",["disconnect","revoke","cut off","anytime","turn off"]],["Read and draft, approve to change",["read","draft","approve","nothing changes"]]],model:"I respect that. You connect it yourself through QuickBooks' own login, so I never get your password, and you can disconnect it anytime. Invoice drafts sit in your dashboard, and nothing gets created in QuickBooks until you approve it."},
{lv:4,who:"Real estate broker",obj:"If this thing texts or emails leads the wrong way, we get sued.",pts:[["Take compliance seriously",["serious","right","compliance","legal"]],["Drafts, you approve",["draft","approve","nothing goes out"]],["Respect opt-outs",["opt-out","opt out","stop","consent","unsubscribe"]],["Your rules, your counsel",["your rules","attorney","counsel","policy"]]],model:"You're right to take that seriously. It's built so it can only draft; nothing goes out until your team approves it. I'd flag stop and opt-out requests so nobody gets messaged again, and we'd follow your consent rules, ideally checked by your own counsel."},
{lv:4,who:"HVAC owner",obj:"Why not just wait a year until this stuff is cheaper and better?",pts:[["Fair point",["fair","could","true","makes sense"]],["Cost of waiting",["waiting","every month","late invoice","missed","lose"]],["Model can be upgraded later",["upgrade","swap","better model","improves"]],["Low-risk start",["pilot","month-to-month","cancel"]]],model:"You could. But every month you wait, the late invoices and missed follow-ups keep costing you. The setup carries forward, so when models get better I upgrade yours. And it's month-to-month, so you're not locked in."},
{lv:4,who:"Roofer",obj:"Month-to-month is fine, but what does it cost me to leave?",pts:[["Nothing beyond the month",["nothing","no fee","no penalty","last month"]],["Data stays in their tools",["your data","stays","quickbooks","your email"]],["Access gets removed cleanly",["disconnect","remove","revoke","shut off"]],["In writing",["writing","written","agreement"]]],model:"Nothing past the current month, no exit fee. Your records stay in your own QuickBooks and email, I disconnect my access and delete my copy, and that's all in writing before you start."},

// ---- Level 5 ----
{lv:5,who:"Tech-savvy team lead (real estate)",obj:"If a big tech company hires you, my whole team's workflow breaks.",pts:[["Answer directly",["fair","honest","good question","direct"]],["This is the business",["my business","building this","full time","focus"]],["Handoff plan",["document","handoff","written","another developer"]],["No lock-in",["your data","stays","month-to-month","your accounts"]]],model:"Fair question. This is my business, not a side gig waiting for a job offer. Still, I document every setup so another developer could take it over, your records stay in your own accounts, and it's month-to-month so you're never trapped."},
{lv:5,who:"GC controller",obj:"Gmail's draft permission can also send. So how is it really draft-only?",pts:[["Admit it's true",["right","true","correct","can also send"]],["Control is in the code",["code","tools","no send","only gave"]],["Logs + review",["logged","logs","audit","record","review"]],["Outlook can be stricter",["outlook","mail.send","stricter","without send"]]],model:"You're right, Google's draft permission could technically send. So it's built so it can only draft: my code never gives the agent a send action, and every action is logged. On Outlook I can go stricter and leave send permission off completely."},
{lv:5,who:"Brokerage owner",obj:"Are you even a real company? Insured? We don't work with hobbyists.",pts:[["Be straight",["honest","straight","fair","truth"]],["What's in place vs once in place",["once in place","working on","setting up","not yet"]],["Offer written terms",["writing","agreement","terms","contract"]],["Respect a requirement",["requirement","not a fit","understand","if you need"]]],model:"Fair, and I'll be straight with you. I'm a solo founder, and things like formal insurance are being set up; once in place I'll send proof. Everything we agree is in writing, and if insurance is a hard requirement today, I understand if we wait."},
{lv:5,who:"Property management controller",obj:"QuickBooks invoices are live as soon as they're created. How do you stop a bad one?",pts:[["Confirm it's live once created",["right","live","once created","correct"]],["Drafts live in the dashboard",["dashboard","draft","not in quickbooks","holds"]],["Created only after approval",["approve","after you","only when"]],["Duplicate checks",["duplicate","double","check","idempot"]]],model:"Correct, once it's created through the API it's live. So the draft lives in my dashboard, not in QuickBooks. The real invoice gets created only after you approve it, and there's a duplicate check so a retry can't bill someone twice."}
);

EXPLAIN.push(
{t:"agents",lv:1,q:"Explain the Cost Center agent to a roofer in plain words.",pts:[["Tracks costs per job",["cost","each job","per job","expense"]],["Compares to the estimate",["estimate","budget","over"]],["Shows profit per job",["profit","margin","making money"]],["Read-only, you confirm fixes",["read","confirm","approve","suggest"]]],model:"It watches what you spend on each job and compares it to what you estimated. If a job is running over, you see it on your dashboard before it's too late. It only reads your books; any fix it suggests waits for you to confirm."},
{t:"agents",lv:2,q:"Explain how the Sales agent helps with estimates that never got a reply.",pts:[["Spots stale estimates",["stale","no reply","sitting","days"]],["Drafts a follow-up",["draft","follow","message"]],["You approve before it goes",["approve","nothing goes","review"]],["Shows the list on the dashboard",["dashboard","list","pipeline"]]],model:"It watches for estimates that have been sitting with no reply for a few days. It drafts a friendly follow-up based on the job, and you approve it before anything goes out. You also get a list on your dashboard of every estimate still waiting."},
{t:"agents",lv:3,q:"Explain how your agents hand work to each other, with one example.",pts:[["Email agent sorts first",["email agent","sort","classif"]],["Hands off to the right agent",["hand","pass","sales","invoicing"]],["Example walk-through",["example","customer","asks","paid"]],["Owner approves the final draft",["approve","draft","owner"]]],model:"The Email agent reads new mail first and sorts it. Say a customer writes, 'Did you get my payment?' It hands that to the Invoicing agent, which checks QuickBooks and drafts a reply with the real status. The owner approves that draft before it goes."},
{t:"process",lv:1,q:"Explain what a paid pilot is and why you offer one.",pts:[["One agent, one problem",["one agent","one problem","single"]],["Paid, small, short",["paid","small","month","price"]],["Proves value first",["prove","worth","see if","results"]],["Then decide to add more",["adding","more agents","expand","decide","cancel"]]],model:"It's a small paid start: one agent on your biggest problem for a month or so. You see if it actually saves time or brings money in faster. Then you decide to add more, keep it as is, or cancel."},
{t:"process",lv:3,q:"Explain how you'd put a dollar number on a prospect's pain during discovery.",pts:[["Ask for counts",["how many","count","each month","week"]],["Ask for values",["worth","average","dollar","hour"]],["Multiply out loud",["multiply","times","adds up","that's about"]],["Let them say it matters",["confirm","does that sound","agree","matter"]]],model:"I ask for counts and values. How many estimates go unanswered a month, and what's an average job worth? How many hours a week on office work? Then I multiply out loud, like 'so that's about $8,000 a month sitting there,' and ask if that sounds right."},
{t:"invoicing",lv:2,q:"Explain why your invoice drafts live in your dashboard and not in QuickBooks.",pts:[["API invoices are live once created",["live","once created","connection","real"]],["Draft held in dashboard",["dashboard","draft","hold"]],["Created after approval",["approve","after","only when"]],["Keeps books clean",["clean","mistake","duplicate","books"]]],model:"In QuickBooks, an invoice created through the connection is real right away, there's no draft step. So I keep the draft in your dashboard. You approve it, and only then does it get created in QuickBooks, which keeps your books clean."},
{t:"invoicing",lv:5,q:"Explain how the Invoicing agent avoids double-billing a customer.",pts:[["Duplicate check before creating",["duplicate","check","already"]],["Unique key per job",["unique","idempot","job number","same invoice"]],["Safe retries",["retry","retries","twice","fail"]],["Approval + log",["approve","logged","record"]]],model:"Before it creates anything, it checks whether an invoice already exists for that job. Each draft has a unique key, so if the connection fails and retries, it can't create the same invoice twice. And every invoice is approved and logged, so a mistake is easy to trace."},
{t:"setup",lv:2,q:"Explain what a customer does during setup and what you handle.",pts:[["They connect their own accounts",["connect","log in","their own","oauth"]],["They answer an intake",["intake","questions","prices","terms"]],["You build and test",["build","test","i set","i handle"]],["Short training + go live",["training","show you how","go live","walk you through"]]],model:"You do two things: connect your own QuickBooks and email with your login, and answer a short intake about your prices and terms. I build it, test it, then show you how to approve drafts on your phone before we go live."},
{t:"setup",lv:4,q:"Explain what happens to a customer's setup and data if they cancel.",pts:[["Data stays in their tools",["stays","your quickbooks","your email","your data"]],["You remove your access",["disconnect","revoke","remove","access"]],["Dashboard data deleted",["delete","remove","wipe"]],["No exit fee",["no fee","nothing","month-to-month"]]],model:"Your real data never left your QuickBooks and email, so it stays there. I disconnect my access and delete what my dashboard stored for you. There's no exit fee, you just don't renew next month."},
{t:"realestate",lv:2,q:"Explain how the Sales agent helps a real estate team answer new leads faster.",pts:[["Speed to lead matters",["speed","fast","first","minutes"]],["Drafts a useful reply",["draft","reply","useful","question"]],["Agent approves quickly",["approve","phone","tap approve"]],["Keeps follow-up going",["follow","nurture","keep"]]],model:"In real estate, the first agent to reply usually wins the lead. The Sales agent drafts a useful reply within minutes of the lead coming in, and your agent approves it from their phone. Then it keeps drafting follow-ups so leads don't go cold."},
{t:"realestate",lv:4,q:"Explain how you keep AI-written listing copy Fair Housing safe.",pts:[["Describe the property, not people",["property","not people","describe","features"]],["Flag risky words",["flag","check","words","phrases"]],["Agent approves",["approve","review","edit"]],["No made-up claims",["made up","claims","accurate","true"]]],model:"The Marketing agent describes the home, not who should live there: bedrooms, yard, near a park. It flags risky phrases before the draft reaches you. It sticks to facts from the listing, and the agent or broker approves every word before it posts."},
{t:"safety",lv:5,q:"Explain how you keep one customer's details from leaking into another customer's reply.",pts:[["Separate setup per customer",["separate","per customer","own setup","isolat"]],["Agent only sees one thread's data",["only sees","this thread","one customer","context"]],["Emails treated as data, not instructions",["data","instruction","inject"]],["Approval + logs catch it",["approve","logged","review"]]],model:"Each customer has their own separate setup, so their data never mixes with another business. Inside one business, the agent only gets the thread and records it needs for that reply. Email text is treated as data, never as instructions, and the owner approves every draft, with everything logged."}
);

const SCRIPTS=[
{name:"Mike, roofer",lv:1,intro:"Friendly owner of a 6-person roofing crew. You caught him at the shop after work.",turns:[
{cust:"Hey, yeah, I got a few minutes. What's this about?",opts:[
["I build AI agents with automated workflows and integrations. Want a full demo right now?",0,"Jargon and a pushy ask before you know anything about him."],
["I help roofers with office work like late invoices. What eats most of your evenings?",2,"Short, plain, and ends with a question so he does the talking."],
["I help small businesses save time with software. Do you have a minute so I can explain how it works?",1,"Polite but vague; tie it to roofing and ask about his day."]]},
{cust:"Honestly, chasing people to pay. My wife and I do invoices at night.",opts:[
["Got it. So I should probably just go ahead and build you the whole system?",0,"Jumping to a sale skips learning how big the problem is."],
["That sounds rough. A lot of roofers deal with that, so you're not alone there.",1,"Kind, but you didn't learn anything you can use."],
["How many invoices are late right now, roughly, and how long do they sit?",2,"Numbers turn a complaint into a dollar figure you can use."]]},
{cust:"Probably eight or so. Some sit sixty days. That's maybe twenty grand.",opts:[
["So about $20,000 sitting out there, plus your nights. That's worth fixing, right?",2,"Say the number back and let him agree it matters."],
["Wow, that's a lot. My Invoicing agent will get every bit of that paid this month.",0,"Never promise results you can't guarantee; you have no track record yet."],
["Okay, good to know. Is that pretty normal in roofing?",1,"Fine, but you let the big number slip past without using it."]]},
{cust:"Sure. But I'm not a computer guy. Sounds complicated.",opts:[
["It's actually pretty simple once you learn the dashboard and the settings. Want me to send you a tutorial?",1,"Reassuring, but it still puts the learning on him."],
["I set it all up. You just tap approve on reminder drafts from your phone.",2,"Takes the work off him and shows how simple daily use is."],
["Don't worry, the AI does everything on its own, you won't even need to look.",0,"Wrong: the owner approves everything. This oversells and scares careful buyers later."]]},
{cust:"What's something like that cost?",opts:[
["Starter is $299 a month plus setup, starting with just invoicing.",2,"Clear number, plain words, and a small way to start."],
["It really depends. I'd have to put a quote together and get back to you on that.",1,"Honest, but dodging a simple question can feel slippery."],
["It's super cheap, basically free compared to what it'll get you back. Want to just try it and see?",0,"Dodges the number and makes a promise you can't back up."]]},
{cust:"Huh. Okay, I might be interested.",opts:[
["Cool, I'll email you some info and you can let me know when you're ready.",1,"Polite, but no date means the deal usually drifts away."],
["Great, if you sign today I'll knock some off the setup price. Should I bring the paperwork by tomorrow?",0,"Pressure and a discount he didn't ask for cheapen the offer."],
["Great. Can I come by Thursday at 5 to show you and your wife on real invoices?",2,"Specific time, includes the person who does the books."]]}
]},
{name:"Rosa, HVAC owner (skeptical)",lv:3,intro:"Owns a 15-tech HVAC company on QuickBooks Online and Gmail. She's had bad software experiences and is short on patience.",turns:[
{cust:"I get five of these calls a week. Why should I listen to you?",opts:[
["Fair. I help HVAC shops with invoices and follow-ups. Is either one a headache?",2,"Respects her skepticism and hands her the floor fast."],
["Because my system is different from everything else out there on the market today.",0,"Every caller says that. Claims with no proof lose skeptical buyers."],
["I understand. I'm a local guy building dashboards for businesses like yours. Can I tell you how it works?",1,"Friendly, but it doesn't give her a reason to keep listening."]]},
{cust:"Follow-ups, maybe. Estimates go out and we never hear back.",opts:[
["Tell me how many estimates a month go quiet, and what an average system install is worth.",2,"Gets the two numbers you need to size the pain."],
["Yeah, that's really common. Customers can be hard to pin down these days. Do you think it's the economy?",1,"Agreeable, but you learned nothing you can build on."],
["My Sales agent will close those for you, so you'll never lose another estimate.",0,"Overpromise. It drafts follow-ups; it doesn't close deals."]]},
{cust:"Maybe fifteen a month. Installs run eight to twelve grand.",opts:[
["Okay, decent number. Can I walk you through what I offer?",1,"You skipped doing the math she would care about."],
["If even two of those come back, that's over $16,000 a month. Does that sound right?",2,"Simple math out loud and a check that she agrees."],
["So you're losing about $150,000 a month, which my agents will recover for sure.",0,"Inflated math and a guarantee. Both kill trust fast."]]},
{cust:"I don't trust AI talking to my customers. It'll say something stupid.",opts:[
["Fair. It's built so it can only draft. Nothing goes out until you approve it.",2,"Validates her and states the safeguard accurately."],
["Don't worry, the AI is really smart now and almost never makes mistakes. Have you tried ChatGPT lately?",0,"Dismissive and untrue. AI does make mistakes; that's why there's approval."],
["I get it. You can turn the agent off any time if it ever does something weird.",1,"True, but it skips the main point: she approves every message."]]},
{cust:"And what's this going to run me?",opts:[
["Pro is $650 a month, plus setup per agent. Most people start smaller. Want me to send the full price sheet?",1,"Clear, but you skipped tying the price back to her $16,000."],
["Starter is $299 a month plus setup. One install win pays for it.",2,"Number stated plainly and anchored to her own pain."],
["We can work something out. What's your budget, and I'll make it fit for you?",0,"No number makes you sound unsure, and it invites haggling."]]},
{cust:"I'll think about it.",opts:[
["Sounds good, no rush at all. I'll check back with you in a couple of weeks. Does that work for you?",1,"Polite, but no specific next step means it usually dies."],
["Fine. What would you need to see to feel sure? I can show you Tuesday on test data.",2,"Finds the real hold-up and offers a specific, low-risk next step."],
["Okay, but this price is only good this week, so you'll want to decide soon.",0,"Fake urgency. Skeptical buyers see through it right away."]]}
]},
{name:"Rick, general contractor (blunt)",lv:4,intro:"Runs a commercial GC firm with 30 people. Uses QuickBooks Online and Outlook. He wants straight answers and hates fluff.",turns:[
{cust:"You've got two minutes. Go.",opts:[
["I'd love to tell you about my company and how our AI dashboards are changing the game for contractors like you.",0,"Fluff about you. He gave you two minutes and you spent them on a slogan."],
["I build dashboards where AI drafts invoices and follow-ups. Where does paperwork slow you down?",2,"One-line offer, then straight to his problem."],
["I help contractors save time on office work with AI. Want me to send you some info?",1,"Clear enough, but you gave away the call instead of asking a question."]]},
{cust:"Pay apps and change orders. My PM spends a day a week on them.",opts:[
["A day a week is a lot. Have you thought about hiring another person for that?",1,"Fair thought, but you're selling against yourself without sizing it."],
["Easy, the AI can fully take that over and your PM won't need to touch it again.",0,"Overpromise. Pay apps need human review; nothing goes out unapproved."],
["What's your PM's time worth per hour, and do late pay apps slow your cash?",2,"Puts a dollar value on the day and ties it to cash flow."]]},
{cust:"Maybe sixty an hour. And yeah, late apps mean we get paid late.",opts:[
["So roughly $2,000 a month in PM time, plus cash arriving late. Is that fair to say?",2,"Simple math out loud, and he confirms the number himself."],
["Cool. So I think we're probably a good fit for each other then, honestly.",1,"Positive, but you didn't use the numbers he just gave you."],
["Then it pays for itself the first week, guaranteed. Want to start today?",0,"A guarantee you can't back up. Blunt buyers punish this."]]},
{cust:"Who else is using this? Show me a contractor it worked for.",opts:[
["I've got a few clients, but they asked me to keep their names private, sorry.",0,"Inventing customers is a lie. If he checks, you're done."],
["Lots of businesses use AI now. It's proven technology at this point. Have you seen what the big companies are doing?",1,"Changes the subject. He asked about you, not the industry."],
["Honestly, none yet. That's why I start with a paid pilot on one agent, month-to-month.",2,"Honest, and it turns the gap into a low-risk offer."]]},
{cust:"What does the pilot cost?",opts:[
["Setup for one agent starts at $2,000, then monthly. No contract, cancel anytime.",2,"Real range, plain terms, and no lock-in."],
["Whatever you think is fair. I'm flexible because I really want your business.",0,"Sounds desperate and tells him your price means nothing."],
["It's in the proposal. Can I email it over for you to read later?",1,"Fine, but he asked a direct question; give him the range."]]},
{cust:"Fine. What's the next step?",opts:[
["I'll put a proposal together and send it over sometime next week. Does that sound okay to you?",1,"Okay, but vague timing lets the deal cool off."],
["Next step is you just sign here and I'll get going on the build right away.",0,"Skips scoping and his PM. Rushing commercial buyers backfires."],
["Thursday, 30 minutes with your PM on one pay app, then a pilot proposal.",2,"Specific, involves the real user, and ends with a clear deliverable."]]}
]},
{name:"Priya, real estate team lead (tech-savvy)",lv:5,intro:"Leads a 9-agent team on Follow Up Boss and Gmail. She's used Zapier and ChatGPT and will push hard on how it really works.",turns:[
{cust:"I've built Zaps and used ChatGPT. What would you do that I can't?",opts:[

["Hi Dee, I sell AI dashboards. Can you pass a message along to the owner for me?",1,"Honest, but you gave her nothing to care about."]]},
{cust:"(Dee) No, Hank does all that himself. At night, mostly. He hates it.",opts:[
["Got it. When's the best time to catch him for 5 minutes, or should I text him?",2,"You got a real pain from her. Now get a time, don't pitch her."],
["Perfect, that's exactly what my product fixes. Let me explain how it works.",0,"She's not the buyer. Pitching her burns your shot."],
["Okay, can you just transfer me to him right now?",1,"Maybe, but you skipped asking what works for him."]]},
{cust:"(Hank, later) Dee said you called. I've got five minutes. Go.",opts:[
["Thanks, Hank. Dee mentioned invoicing eats your nights. How many invoices a week, and how long do they take?",2,"Uses what you learned, then hands him the floor with a number question."],
["I build private dashboards with five AI agents: Sales, Marketing, Cost Center, Invoicing and Email.",0,"A feature list before you know his problem."],
["Thanks. So what's the biggest problem in your business right now?",1,"Okay, but you ignored what Dee already told you."]]},
{cust:"About 20 a week. Two, three hours. And honestly about $14,000 is past due right now.",opts:[
["So 10-plus hours a month of your nights, plus $14,000 sitting out. Is that worth fixing?",2,"Say the math back and let him agree it matters."],
["Wow, $14,000. That's a lot of money. You should really chase that down.",1,"True, but you didn't size the time cost or ask him."],
["My Invoicing agent will collect all of that for you, guaranteed.",0,"Never guarantee collections. That's a promise you can't keep."]]},
{cust:"Yeah, it's worth fixing. What do you use, QuickBooks?",opts:[
["It works with QuickBooks Online. Which version are you on?",2,"Check before you promise. Desktop is a different story."],
["Yep, it works with every version of QuickBooks.",0,"False. Don't assume Online vs Desktop."],
["It connects to most accounting tools, so you should be fine.",1,"Vague. Ask which one he actually has."]]},
{cust:"QuickBooks Online. Okay, show me what it actually does.",opts:[
["This is sample data, not a real customer. Here's an overdue invoice, and here's the reminder the agent drafted. Nothing's sent until you tap approve.",2,"Sample data, his exact problem, and the approval step up front."],
["Let me log into one of my customers' dashboards so you can see real numbers.",0,"Never show another customer's data."],
["Sure, let me start with the Marketing agent, then I'll go through all five.",1,"Starts away from his pain. Show the fix for what he told you."]]},
{cust:"Wait. So it sends that to my customer by itself?",opts:[
["No. It's only a draft. You can edit it, and it goes out from your email only when you approve it.",2,"Clear, calm, and the truth."],
["It can, if you turn on auto-send. Most people like that.",0,"Your product is draft-only. Don't invent features."],
["Only if you want it to. It's pretty flexible that way.",1,"Fuzzy. Say plainly: it drafts, you approve."]]},
{cust:"Okay. And it's going to mess with my books?",opts:[
["My code only lets it read your books and draft. Invoices get created in QuickBooks after you approve them, and everything is logged.",2,"Explains the real control and the approval point."],
["No, AI is really accurate these days, so you don't have to worry about that.",0,"Overpromise. The protection is the design, not the AI being perfect."],
["It shouldn't, but if it does, we can fix it.",1,"Honest-ish, but it doesn't explain why it's safe."]]},
{cust:"Alright. What's this cost me?",opts:[
["For the Invoicing agent: a one-time setup of $2,000 and $299 a month on Starter. Month-to-month. If it gives you back 10 hours of nights a month and gets that $14,000 collected, it pays for itself.",2,"Clear numbers, terms, and value tied to his own figure."],
["It depends. What's your budget?",1,"Fishing for budget after a demo feels evasive. Give the number."],
["It's $650 a month, but I can do $300 if you sign today.",0,"Wrong tier for one agent, and a fake deadline discount."]]},
{cust:"$299 a month. I don't know. That's real money for me.",opts:[
["Fair. Let's start with a paid pilot on just invoicing. We write down where you are today, and at day 30 we look at the numbers together. Keep it or cancel.",2,"Shrinks the risk and sets a measurable review."],
["Honestly it's cheaper than a part-time bookkeeper, so it's a no-brainer.",1,"Maybe true, but you argued instead of lowering the risk."],
["I understand. Should I just check back with you in a few months?",0,"You gave up right after he showed interest."]]},
{cust:"A pilot. Okay. What do you need from me?",opts:[
["About an hour: we fill out your business profile together and you approve the QuickBooks connection on Intuit's screen. You never give me your password.",2,"Concrete, short, and answers the trust question before he asks."],
["Just send me your QuickBooks login and I'll set everything up.",0,"Never ask for passwords. Connections use OAuth."],
["Not much, I'll handle it. I'll reach out when it's ready.",1,"Too vague. Tell him exactly what he does."]]},
{cust:"Sounds fine. Send me something.",opts:[
["I'll email the proposal tonight with the price and what's included. Can we start Monday the 15th, with the one-hour setup call at 7am?",2,"Specific next step with a date and time. That's a close."],
["Great, I'll send something over and you can let me know.",0,"No date, no next step. This is how deals die."],
["Sounds good. I'll send the proposal and follow up next week.",1,"Better, but no start date and no booked call."]]}
]},
{name:"Full call: Alana, real estate team lead (referral)",lv:4,intro:"Full call. Alana leads a 6-agent real estate team. A roofer you work with referred you. Her brokerage already has a CRM.",turns:[
{cust:"Hi, Marco said you set up something for his roofing company. I have ten minutes.",opts:[
["Thanks for taking the call. Marco's leads were sitting unanswered. Before I say anything about what I do, how fast does your team reply to new leads?",2,"Uses the referral briefly, then makes it about her."],
["Great! So I build AI dashboards with five agents, let me run through them.",0,"A pitch before any discovery."],
["Thanks. Marco loves it. It's saved him a ton of time. Want to hear how?",1,"Social proof is fine, but you still don't know her problem."]]},
{cust:"Honestly? Depends who gets it. Some agents reply in minutes, some take a day.",opts:[
["How many leads a month for the team, and what happens to the ones who don't answer the first time?",2,"Sizes the problem and finds the follow-up gap."],
["A day is way too slow. You're definitely losing deals.",1,"Probably true, but you told instead of asked."],
["That's normal for real estate. Most teams are like that.",0,"You just talked her out of having a problem."]]},
{cust:"Maybe 150 a month. The ones who don't answer mostly just... sit.",opts:[
["So most of 150 leads a month get one touch and then nothing. If even two of those turn into deals a year, what's that worth to the team?",2,"Ties it to commission, in her words."],
["My lead follow-up setup would fix that completely.",0,"Overpromise, and no number yet."],
["That's a lot of leads to waste. Do you track it anywhere?",1,"Fair question, but you didn't size the value."]]},
{cust:"Two deals? Probably $20,000 in commission. But we already have a CRM that does follow-ups.",opts:[
["Then let's not replace it. Does it send templates, or a real reply that sounds like the agent? This drafts personal replies, your agents approve, and it works alongside the CRM.",2,"Respects her tool and finds the real gap."],
["Your CRM's follow-ups are probably bad. Mine is better.",0,"Trashing her tools makes her defend them."],
["Okay. Does it work well?",1,"Neutral, but you lost the thread."]]},
{cust:"Templates. People can tell. Okay, how does yours work?",opts:[
["This is sample data. A new lead comes in, the agent drafts a reply using the listing they asked about, and the agent on your team edits or approves it on their phone.",2,"Plain, sample data, and the approval step."],
["It uses a large language model with retrieval over your MLS feed and CRM webhooks.",0,"Jargon. She asked how it works for her team."],
["It writes the reply and sends it right away so you're the fastest team in town.",0,"False: nothing sends without approval."]]},
{cust:"What about texting? I heard there are rules on that.",opts:[
["There are, and I'm not a lawyer, so check with your broker. It only drafts, your agents approve each text, and I can limit it to leads who gave consent and stop for anyone who replies stop.",2,"Honest about limits, safe setup, and no legal advice."],
["Don't worry about it. Everyone texts leads now.",0,"Waves off real legal risk."],
["I think it's fine as long as they filled out a form.",1,"Sounds like legal advice. Send her to her broker."]]},
{cust:"And Fair Housing? I can't have it writing something that gets us in trouble.",opts:[
["The Marketing agent describes the home, not who should live there. It flags risky phrases, and nothing posts until your agent approves it.",2,"Correct and specific."],
["The AI knows Fair Housing law, so it won't make mistakes.",0,"Overclaim. The safety is review plus flags, not a perfect AI."],
["Your agents should know the rules, so they'll catch anything.",1,"Partly true, but explain what the tool does too."]]},
{cust:"Okay. What would this cost for six agents?",opts:[
["The Team plan is $650 a month with your login, plus $40 for each agent, so $890 for all six, plus a one-time setup. Most teams start with lead follow-up for two agents.",2,"Real numbers from the price sheet, plus a smaller start."],
["$99 a month, flat. Super cheap.",0,"Not your price. Lowballing to win costs you later."],
["It's pretty expensive, honestly. Probably a few thousand.",1,"Vague and scares her off with no reason."]]},
{cust:"I'd have to run it by my broker. She signs off on any tools.",opts:[
["Makes sense. What will matter most to her, cost, compliance or results? I'll put a one-page summary on that. Can we get 15 minutes with both of you this week?",2,"Finds the decider's concerns and books a joint meeting."],
["Can't you just sign up yourself? It's month-to-month, so it's low risk.",0,"Goes around the decider. That backfires."],
["Sure, let me know what she says.",1,"Hands control away with no next step."]]},
{cust:"Probably compliance. She's careful.",opts:[
["Then I'll bring the texting and Fair Housing setup in writing, plus how data is stored and deleted if you cancel. Does Thursday at 9 work for both of you?",2,"Tailors to the decider's worry and asks for a time."],
["Compliance is no problem at all. It's fully compliant.",0,"Blanket claim you can't back up."],
["Okay. I'll email you some information.",1,"Too vague, no meeting."]]},
{cust:"(Thursday, with the broker) I like it. But I want proof it works before we pay for the whole team.",opts:[
["Fair. A 30-day paid pilot with two agents, lead follow-up only. We record your reply time today and review it on day 30. Keep, expand or cancel.",2,"Low-risk, measurable, decision date built in."],
["It definitely works. Marco's numbers prove it.",1,"One roofer isn't proof for her team."],
["I can give you the first three months free.",0,"Giving it away trains them not to value it."]]},
{cust:"Okay, two agents for 30 days. What's next?",opts:[
["I'll send the proposal today. Can we start on the 1st, with a 45-minute setup call with your two agents that Monday at 10?",2,"Clear start date and booked setup. Closed."],
["Great! I'll be in touch soon.",0,"No date. Momentum dies."],
["I'll send the proposal. Let me know when you're ready to start.",1,"Leaves the start date to chance."]]}
]}
);

{t:"process",lv:1,q:"Ask your 5 best discovery questions for a roofer.",pts:[["Biggest office headache",["headache","time","after hours","biggest"]],["Past-due money",["past due","late","unpaid","owed"]],["Estimates that go quiet",["estimate","quote","hear back"]],["Current tools",["quickbooks","gmail","outlook","software"]],["Who decides / does the books",["decide","wife","books","say in"]]],model:"One: what eats most of your time after the crew goes home? Two: how much is past due right now, roughly? Three: how many estimates a month never get a reply? Four: what do you use for invoices and email, QuickBooks, Gmail? Five: who does the books, and who else would want a say in this?"},
{t:"realestate",lv:2,q:"Ask your discovery questions for a real estate team lead.",pts:[["Team size and lead volume",["agents","leads","month","volume"]],["Speed to reply",["fast","reply","respond","minutes","hours"]],["Where leads come from / tools",["zillow","crm or","website","come in","gmail"]],["What happens to old leads",["first time","cold","nurture","follow","answer"]],["Who decides and budget",["decide","broker","budget","sign"]]],model:"How many agents are on the team, and about how many leads a month? How fast does a new lead usually get a reply? Where do leads come in, and what CRM or email do you use? What happens to leads that don't answer the first time? And besides you, who signs off on a tool like this?"},
{t:"process",lv:3,q:"Ask for the close after a good demo.",pts:[["Recap the value in their words",["you said","your","recap","past due","hours"]],["Check for concerns",["concern","question","anything","holding"]],["Direct ask",["start","move forward","ready","sign"]],["Concrete next step",["proposal","today","monday","agreement","setup"]]],model:"So you said about $9,000 is past due and you lose three nights a week to invoices. You saw the agent draft reminders from your real invoices, and you approve each one. Any questions or concerns before we move forward? If not, I'll send the agreement today and we can start setup Monday. Sound good?"},
{t:"process",lv:3,q:"Handle silence after you state the price.",pts:[["Stay quiet, let them speak first",["quiet","wait","silence","pause","let them"]],["Don't discount yourself",["discount","lower","don't drop","hold"]],["Then ask an open question",["what's","how does","thoughts","question"]],["Tie back to their cost of the problem",["past due","cost","hours","worth"]]],model:"I say the price and then I stop talking. Silence feels awkward, but if I fill it I'll start discounting against myself. I wait for them to speak first. If it goes long, I ask one open question, like 'How does that sit compared to the $9,000 past due?' Then I listen."},
{t:"process",lv:4,q:"Set the next step when they say 'let me think about it.'",pts:[["Respect it",["fair","makes sense","of course","respect"]],["Find the real concern",["what part","concern","price","timing","unsure"]],["Offer something useful",["send","answer","check","info"]],["Book a specific time",["thursday","friday","date","calendar","call back"]]],model:"Totally fair, it's a real decision. Can I ask what part you want to think over, the price, the timing, or whether it'll work for you? That way I can send you the right info. Then let's put 10 minutes on Thursday at 4 to decide either way. Does that work?"},

EXPLAIN.push(
{t:"privacy",lv:5,q:"A CPA firm asks how you keep one customer's data from ever showing up in another customer's drafts. Walk through your tenant isolation, layer by layer.",pts:[["Separate storage per customer",["separate","own database","own storage","per customer","per-customer"]],["Separate tokens/credentials per customer",["token","credential","key","oauth"]],["Code enforces it, not the prompt",["code","enforce","not the prompt","not just","prompt isn't"]],["Each run loads only one customer's context",["one customer","each run","only their","scoped","context"]],["Logs/memory/profiles kept separate too",["log","memory","profile"]],["Tested and checked",["test","check","audit","review"]]],model:"Every customer is a separate tenant. Their data lives in their own storage, and their QuickBooks and Gmail tokens are stored separately and encrypted. When an agent runs, my code loads only that one customer's profile, memory and data, so the model never sees anyone else's information. That rule is enforced in code, not by telling the AI to keep things private, because a prompt isn't a security control. Logs and memory are separated the same way. I also test it: I run checks that try to pull another tenant's data and make sure they fail."},
{t:"safety",lv:5,q:"You find out a customer's Gmail connection token may have leaked from your server. Walk through your breach response from the first hour to the follow-up.",pts:[["Contain first: revoke/rotate tokens",["revoke","rotate","disconnect","cut off","contain"]],["Figure out what was accessed",["log","what was","accessed","scope","investigate"]],["Tell the customer quickly and plainly",["tell","notify","call","customer"]],["Check legal notice duties (lawyer)",["law","legal","lawyer","attorney","required"]],["Fix the root cause",["root cause","fix","patch","how it"]],["Write it up and follow up",["write","report","document","follow"]]],model:"First I contain it: revoke the token, rotate any related keys and pause that customer's agents. Then I check the logs to see what was accessed, when and from where. I call the customer that day and tell them plainly what I know and what I don't yet, and what they should watch for. I talk to a lawyer about notice rules, since Oregon has deadlines for notifying people when personal information is breached. Then I find and fix the root cause, reconnect with a fresh token, and send the customer a short written report with what happened, what I changed and how I'll check it."},
{t:"pricing",lv:5,q:"A contractor with 3 offices wants agents in all of them. Walk through how you'd price the deal and why it's custom-quoted.",pts:[["Custom-quoted, not a sheet tier",["custom","quote","not a tier","not the price sheet"]],["Discovery per office first",["discovery","each office","per office","workflow"]],["Know your cost to serve",["cost to serve","hosting","api","margin"]],["Separate setup from monthly",["setup","one-time","monthly"]],["Start with a pilot office",["pilot","one office","first office","phase"]],["Milestone payments",["milestone","deposit","go-live","stage"]]],model:"It's custom-quoted, because three offices means more agents, more connectors and more support than any tier covers. I start with paid discovery at each office to map how they actually work. Then I add up my cost to serve: AI usage, hosting, any private hosting, connectors and my support time, and price the monthly so the margin stays healthy. Setup is priced separately from the monthly. I'd roll out at one pilot office first and bill on milestones: a deposit at signing, a payment when the pilot office goes live, and the rest when all three are live. That way they see results before paying in full."},
{t:"safety",lv:5,q:"A customer's agent drafted an invoice with the wrong amount, the owner approved it, and it went to their client. Walk through how you handle it.",pts:[["Own your part, no blame",["sorry","my part","own","not blame","no blame"]],["Stop it from spreading (pause/check others)",["pause","check","other invoices","stop"]],["Help fix it with the client (correction draft)",["correct","corrected","void","credit","draft"]],["Find the real root cause",["root cause","why","tool data","pulled","source"]],["Add a test/check so it can't repeat",["test","eval","check","flag"]],["Follow up in writing",["write","follow","report","explain"]]],model:"First I tell the owner I'm sorry and take my part. The draft came from my agent, so I don't blame them for approving it. I pause that agent's invoice drafts and check other recent invoices for the same problem. Then I help fix it with their client: I draft a corrected invoice or credit memo and a short note they can edit and send. Next I find the real cause, like a total the model wrote instead of pulling it from QuickBooks. I fix that in code and add the case to my eval set so it can't slip through again. Finally, I send the owner a short write-up of what happened and what changed."}
);

function h(s){let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return (x>>>0).toString(36)}
const ITEMS=[];
CARDS.forEach(c=>ITEMS.push({id:"c"+h(c[2]),type:"card",t:c[0],lv:c[1],q:c[2],a:c[3]}));
MCQ.forEach(m=>ITEMS.push({id:"m"+h(m[3]),type:"mcq",kind:m[2],t:m[0],lv:m[1],q:m[3],ch:m[4],ans:m[5],why:m[6]}));
EXPLAIN.forEach(e=>ITEMS.push({id:"e"+h(e.q),type:"explain",t:e.t,lv:e.lv,q:e.q,pts:e.pts,model:e.model}));
if(typeof REVIEW!=="undefined")REVIEW.forEach(r=>ITEMS.push({id:"r"+h(r.ctx),type:"review",t:r.t,lv:r.lv,q:r.ctx,ctx:r.ctx,draft:r.draft,issues:r.issues,fixed:r.fixed}));
OBJECTIONS.forEach(o=>ITEMS.push({id:"o"+h(o.obj),type:"obj",t:"sales",lv:o.lv,who:o.who,q:o.obj,pts:o.pts,model:o.model}));
const BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));

// ===== State & storage =====
const KEY="dash-agent-trainer-v1";
let S={lv:0,topic:"all",prog:{},exams:[],days:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function sane(){if(!S||typeof S!=="object")S={};if(!S.prog||typeof S.prog!=="object")S.prog={};if(!Array.isArray(S.exams))S.exams=[];if(!Array.isArray(S.days))S.days=[];if(typeof S.lv!=="number"||S.lv<0||S.lv>5)S.lv=0;if(typeof S.topic!=="string")S.topic="all";if(!S.hist||typeof S.hist!=="object")S.hist={}}sane();
let dbRef=null,saveT=null,saving=false,dirty=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,1500)}}
async function flush(){if(!dbRef||saving||!dirty)return;saving=true;dirty=false;
  try{await dbRef.set({s:JSON.stringify(S),at:Date.now()})}catch(e){if(e&&e.code==="invalid_argument")dbRef=null}
  saving=false;if(dirty)flush()}
function merge(remote){if(!remote||typeof remote!=="object")return;if((remote.resetAt||0)<(S.resetAt||0))return;if((remote.resetAt||0)>(S.resetAt||0)){S.prog={};S.exams=[];S.days=[];S.mset={};S.resetAt=remote.resetAt} // keep the most-practiced record per item
  for(const [k,v] of Object.entries(remote.prog||{})){const l=S.prog[k];if(!l||((v.r||0)+(v.w||0))>((l.r||0)+(l.w||0)))S.prog[k]=v}
  const ex=new Set(S.exams.map(e=>e.at));(remote.exams||[]).forEach(e=>{if(!ex.has(e.at))S.exams.push(e)});
  S.days=[...new Set([...(S.days||[]),...(remote.days||[])])].sort().slice(-400);if(remote.mset&&typeof msMerge==="function")S.mset=msMerge(S.mset,remote.mset);sane();}
let AI=null;
(async()=>{if(!window.claude||!claude.use)return;
  try{const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(db&&user){const id=await user.id();if(id){const ref=db.doc("data/users/"+id+"/progress");
      try{const snap=await ref.get();if(snap.exists){merge(JSON.parse(snap.data().s||"{}"));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(view==="home")render()}}catch(e){}
      dbRef=ref;}}}catch(e){}
  try{AI=await claude.use("sample");if(view==="home"||view==="rp")render()}catch(e){AI=null}
})();

function rec(id,ok){const p=S.prog[id]||{box:0,r:0,w:0};

  p.t=Date.now();S.prog[id]=p;
  {const it=BYID[id];if(it){S.hist=S.hist||{};const hl=S.hist[it.lv]=S.hist[it.lv]||[];hl.push(ok?1:0);if(hl.length>40)hl.splice(0,hl.length-40)}}

  });
  const qs=s.q?Object.entries(s.q).filter(([k])=>k.startsWith(s.agent)):[],got=qs.filter(([k,v])=>v.pick!==null&&v.opts[v.pick]===ag.nodes[+k.slice(s.agent.length)][1]).length;

  const doneAll=s.quiz&&qs.length===ag.nodes.length&&qs.every(([k,v])=>v.pick!==null);const nxt=names[(names.indexOf(s.agent)+1)%names.length];
  if(doneAll)$("#app").insertAdjacentHTML("beforeend",`<div class="why ${got===ag.nodes.length?"ok":"bad"}" style="margin-top:14px"><b>${s.agent}: ${got}/${ag.nodes.length}.</b> ${got===ag.nodes.length?"You know this agent end to end.":"Study view shows the right steps; then quiz again."}</div>`);
  dock(doneAll?`<button class="btn s" onclick="sess.q={};render();window.scrollTo(0,0)">Retry ${s.agent}</button><button class="btn" onclick="sess.agent='${nxt}';sess.q={};render();window.scrollTo(0,0)">Next: ${nxt}</button>`:`<button class="btn ${s.quiz?"s":""}" onclick="sess.quiz=!sess.quiz;sess.q={};render()">${s.quiz?"Study view":"Quiz me on this map"}</button>`);

function rpSys(p){const g=RPGOALS.find(x=>x[0]===(S.rpGoal||"full"));return `This practice call's focus: ${g[2]} You are role-playing a potential customer so a 20-year-old founder named Tanner can practice selling. Tanner sells private business dashboards with built-in AI agents (Sales, Marketing, Cost Center, Invoicing, Email). The agents are draft-only (the owner approves everything) and connect to tools like QuickBooks Online and Gmail/Outlook. Your character: ${p.desc} Difficulty: ${LV[p.lv]}. Stay fully in character as this person. Reply in 1-3 short spoken sentences. Raise realistic questions and objections for this character, one at a time. React to what Tanner actually says: if he's vague, overpromises, uses jargon or gets a fact wrong, push on it like a real customer would. Never coach him and never break character.`}

function ptStart(i){const list=SCRIPTS.map((c,j)=>[c,j]).sort((a,b)=>a[0].lv-b[0].lv);if(i===undefined){view="ptpick";sess={list};return render()}
  view="partner";sess={sc:SCRIPTS[i],t:0,pts:0,log:[],show:false,ums:0,pauses:0};render();window.scrollTo(0,0)}
function ptPickR(){$("#app").innerHTML=`<div class="top"><button class="x" onclick="go('home')" aria-label="Close">${ic("x")}</button><b class="ttl">Practice with a friend</b></div><div class="why" style="margin-bottom:12px">Pick a customer, then hand your phone to your friend. They read each line out loud and score your spoken answer. You don't look at the screen.</div>`+sess.list.map(([c,j])=>`<button class="tile" onclick="ptStart(${j})"><b>${esc(c.name)} <span class="tag lv">${LV[c.lv]}</span></b><span>${esc(c.intro)}</span></button>`).join("");dock("")}
function ptR(){const s=sess,sc=s.sc;
  if(s.t>=sc.turns.length){const max=sc.turns.length*2;rec("partner"+sc.name,s.pts/max>=0.8);
    $("#app").innerHTML=`<div class="top"><button class="x" onclick="go('home')" aria-label="Close">${ic("x")}</button><b class="ttl">${esc(sc.name)}</b></div><div class="big fin">${s.pts}/${max}</div><div class="mut fin">scored by your friend</div><div class="why" style="margin-top:12px">Ums/uhs: ${s.ums} · Long pauses: ${s.pauses}. ${s.ums+s.pauses<=3?"Smooth delivery.":"Run it again and slow down: pausing silently beats filling with um."}</div><h2>Notes</h2>${s.log.map(l=>`<div class="pt"><i class="${l.p===2?"y":l.p===1?"w":"n"}">${l.p===2?"✓":l.p===1?"~":"!"}</i><span><b>${esc(l.cust)}</b><br>Best answer: ${esc(l.best)}</span></div>`).join("")}`;
    return dock(`<button class="btn s" onclick="go('home')">Home</button><button class="btn" onclick="ptStart(SCRIPTS.indexOf(sess.sc))">Run it again</button>`)}
  const turn=sc.turns[s.t],best=turn.opts.find(o=>o[1]===2),ok=turn.opts.find(o=>o[1]===1);
  $("#app").innerHTML=topbar(s.t,sc.turns.length)+`<div class="mut">For your friend: read this line out loud, in character.</div><div class="msg them" style="font-size:19px"><b>${esc(spk(sc,turn))}:</b> ${esc(turn.cust.replace(/^\([^)]*\)\s*/,""))}</div>
  ${s.show?`<h2>Listen for</h2><div class="model">${esc(best[2])}</div><div class="note">Example of a strong answer: ${esc(best[0])}</div><div class="note">A weaker answer looks like: ${esc(ok[0])}</div><h2>How did Tanner do?</h2>`:`<div class="why">Tanner answers out loud now. Tap a counter each time you hear it, then tap Show what to listen for.</div>`}<div class="row" style="margin-top:12px"><button class="chip" onclick="sess.ums++;render()">Um / uh: ${s.ums}</button><button class="chip" onclick="sess.pauses++;render()">Long pause: ${s.pauses}</button></div>${s.t===sc.turns.length-1?`<div class="note">Last turn: did he ask for a specific next step? Score Strong only if yes.</div>`:""}`;
  dock(s.show?`<button class="btn r" onclick="ptRate(0)">Weak</button><button class="btn s" onclick="ptRate(1)">Okay</button><button class="btn g" onclick="ptRate(2)">Strong</button>`:`<button class="btn" onclick="sess.show=true;render()">Show what to listen for</button>`)}
function ptRate(v){const s=sess,turn=s.sc.turns[s.t];s.pts+=v;s.log.push({cust:turn.cust,p:v,best:turn.opts.find(o=>o[1]===2)[0]});s.t++;s.show=false;render();window.scrollTo(0,0)}

function spk(sc,turn){const m=turn&&turn.cust.match(/^\(([A-Z][a-z]+)/);if(m)return m[1];return sc.name.replace(/^Full call:\s*/,"").split(",")[0]}
// ===== Mastery sets =====
// 15 MCQs per set, built at runtime from ITEMS type "mcq" (never hardcoded).
// Order: level (Beginner→Insane), then topic (TOPICS key order), then item id. Sets are cut per level,
// so a new or edited MCQ only moves items inside its own level; set keys are "lv-n", so other levels never change.
// Mastery is tracked per item (S.mset.ok), so an item that shifts into a neighbouring set keeps its mastery;
// only genuinely new items reopen a set ("2 new"). Unlocking uses the sticky passed flag, so a new item never relocks later sets.
// State: S.mset={ok:{id:1}, s:{"lv-n":{round,size,q:[ids left this round],miss:[ids missed this round],passed,at}}}
var msReady=true; // functions hoist across the one built script, so app.js's first home render runs before these consts exist
const MS_N=15,MS_T={basics:"Basics",agents:"Agents",connect:"Connections",safety:"Safety",privacy:"Privacy",models:"Models",pricing:"Pricing",sales:"Sales",compete:"Competitors",ops:"Ops",legal:"Legal",realestate:"Real estate",process:"Sales process",invoicing:"Invoicing",setup:"Setup"};
let msCache=null;
function msSets(){if(msCache&&msCache.n===ITEMS.length)return msCache.sets;
  const tk=Object.keys(TOPICS),to=t=>{const i=tk.indexOf(t);return i<0?999:i},seen=new Set(),sets=[];
  const m=ITEMS.filter(i=>i.type==="mcq"&&!seen.has(i.id)&&seen.add(i.id)).sort((a,b)=>a.lv-b.lv||to(a.t)-to(b.t)||(a.t<b.t?-1:a.t>b.t?1:0)||(a.id<b.id?-1:1));
  for(let lv=1;lv<=5;lv++){const L=m.filter(i=>i.lv===lv);for(let j=0;j*MS_N<L.length;j++){const its=L.slice(j*MS_N,j*MS_N+MS_N),ts=[...new Set(its.map(i=>i.t))].map(t=>MS_T[t]||TOPICS[t]||t);
    sets.push({k:lv+"-"+(j+1),lv,ids:its.map(i=>i.id),label:ts.length>1?ts.slice(0,-1).join(", ")+" & "+ts[ts.length-1]:ts[0]})}}
  msCache={n:ITEMS.length,sets};return sets}
function msS(){if(!S.mset||typeof S.mset!=="object")S.mset={};const M=S.mset;if(!M.ok||typeof M.ok!=="object")M.ok={};if(!M.s||typeof M.s!=="object")M.s={};return M}
function msMerge(l,r){l=l&&typeof l==="object"?l:{};if(!r||typeof r!=="object")return l;const ok=Object.assign({},r.ok||{},l.ok||{}),s=Object.assign({},l.s||{});
  for(const [k,v] of Object.entries(r.s||{})){if(!v||typeof v!=="object")continue;const x=s[k];if(!x)s[k]=v;else if(v.passed&&!x.passed){x.passed=true;x.at=v.at}}return {ok,s}}
function msInfo(i){const st=msSets()[i],M=msS(),x=M.s[st.k],got=st.ids.filter(id=>M.ok[id]).length;return {st,x,got,mast:got===st.ids.length&&!!(x&&x.passed),open:i===0||!!x||!!(M.s[msSets()[i-1].k]||{}).passed}}
function msNext(){const n=msSets().length;for(let i=0;i<n;i++){const f=msInfo(i);if(f.open&&!f.mast)return i}return -1}
function msPill(){if(!msReady)return "";const n=msSets().length,i=msNext();return i<0?"All "+n+" done":"Set "+(i+1)+" of "+n}
function msCard(it){if(it._card!==undefined)return it._card;const stop=new Set("that this with what your from they them have when will does which their there about into than then only just more most also each some need needs".split(" "));
  const w=s=>new Set(String(s).toLowerCase().match(/[a-z0-9$%]{4,}/g)||[]),q=w(it.q+" "+it.ch[it.ans]);let best=null,bs=0;
  ITEMS.forEach(c=>{if(c.type!=="card"||c.t!==it.t)return;let n=0;w(c.q+" "+c.a).forEach(x=>{if(q.has(x)&&!stop.has(x))n++});if(n>bs){bs=n;best=c}});return it._card=bs>=4?best:null}
function msOpen(i){const st=msSets()[i];if(!st)return go("msets");const M=msS();let x=M.s[st.k];const left=st.ids.filter(id=>!M.ok[id]);
  if(x&&x.q&&x.q.filter(id=>st.ids.includes(id)).length){x.q=x.q.filter(id=>st.ids.includes(id))}
  else if(x&&left.length){x.round=(x.round||1)+1;x.q=shuffle(left);x.size=x.q.length;x.miss=[]}
  else{x=M.s[st.k]=Object.assign(x||{},{round:1,q:shuffle(st.ids),size:st.ids.length,miss:[],passed:!!(x&&x.passed)})}
  if(x.passed===undefined)x.passed=false;window._topicFallback=false;save();view="mset";sess={i,cur:null,ans:null,end:false};window.scrollTo(0,0);render()}
function msTap(n){const s=sess;if(s.ans!==null)return;const st=msSets()[s.i],M=msS(),x=M.s[st.k],it=s.cur.it,ok=n===s.cur.ans;s.ans=n;
  if(ok)M.ok[it.id]=1;else{delete M.ok[it.id];x.miss.push(it.id)}x.q=x.q.filter(id=>id!==it.id);stamp(ok);rec(it.id,ok);render()}
function msGoOn(){const s=sess,st=msSets()[s.i],M=msS(),x=M.s[st.k];s.ans=null;s.cur=null;
  if(!x.q.length){s.end=true;if(!x.miss.length&&st.ids.every(id=>M.ok[id])){x.passed=true;x.at=Date.now()}save()}render();window.scrollTo(0,0)}
function msRedo(){const s=sess,st=msSets()[s.i],M=msS(),x=M.s[st.k];x.round=(x.round||1)+1;x.q=shuffle(st.ids.filter(id=>!M.ok[id]));x.size=x.q.length;x.miss=[];save();s.end=false;render();window.scrollTo(0,0)}
function msR(){if(view==="msets")return msList();const s=sess;if(!s)return go("msets");const st=msSets()[s.i];if(!st)return go("msets");const M=msS(),x=M.s[st.k];
  const top=(lab,i,n)=>`<div class="top"><button class="x" onclick="go('msets')" aria-label="Close">${ic("x")}</button><div class="bar"><i style="width:${n?Math.round(i/n*100):0}%"></i></div><span class="count">${lab}</span></div>`;
  const name=`Set ${s.i+1} · ${LV[st.lv]}`;
  if(s.end){const right=x.size-x.miss.length,left=st.ids.filter(id=>!M.ok[id]),done=!left.length&&x.passed,nx=msSets()[s.i+1];
    $("#app").innerHTML=top(name,1,1)+`<div class="mut">${name} · Round ${x.round}</div><div class="big">${done?"100%":right+"<small>/"+x.size+"</small>"}</div>`+
      (done?`<div class="why ok"><b>Set ${s.i+1} mastered.</b> ${x.round>1?`It took ${x.round} rounds. `:""}Every question right.${nx?" Set "+(s.i+2)+" is open.":""}</div>`:
      `<div class="why bad"><b>${left.length} to redo.</b> You keep going on just these until a round has zero misses.</div>`+x.miss.map(id=>BYID[id]).filter(Boolean).map(it=>`<div class="why ms-miss"><b>${esc(it.q)}</b><br>Answer: ${esc(it.ch[it.ans])}</div>`).join(""));
    return dock(done?(nx?`<button class="btn s" onclick="go('msets')">All sets</button><button class="btn" onclick="msOpen(${s.i+1})">Next set →</button>`:`<button class="btn" onclick="go('msets')">All sets done</button>`):`<button class="btn" onclick="msRedo()">Redo the ${left.length} you missed</button>`)}
  if(!x)return go("msets");if(!x.q.length&&s.ans===null)return msGoOn();
  if(!s.cur){const it=BYID[x.q[0]];if(!it){x.q.shift();return render()}s.cur=prep(it)}
  const cur=s.cur,it=cur.it,a=s.ans,done=x.size-x.q.length-(a===null?0:1),card=a!==null&&a!==cur.ans?msCard(it):null;
  $("#app").innerHTML=top((done+1)+"/"+x.size,done,x.size)+`<div class="mut ms-sub">${name} · ${x.round>1?"Redo round "+x.round:"Round 1"}</div><div>${meta(it)}</div><div class="q">${esc(it.q)}</div>`+
    cur.ch.map((c,i)=>`<button class="opt ${a!==null?(i===cur.ans?"good":i===a?"badc":""):""}" ${a!==null?"disabled":""} onclick="msTap(${i})">${esc(c)}</button>`).join("")+
    (a!==null?`<div class="why ${a===cur.ans?"ok":"bad"}"><b>${a===cur.ans?"Correct.":"Not quite."}</b> ${esc(it.why)}</div>`:"")+
    (card?`<div class="why ms-card"><span class="tag">Flashcard</span><b>${esc(card.q)}</b><br>${esc(card.a)}</div>`:"");
  dock(a!==null?`<button class="btn" onclick="msGoOn()">${x.q.length?"Next →":"See round score →"}</button>`:"");
  if(a!==null)setTimeout(()=>{const w=$(".why");if(w&&w.scrollIntoView)w.scrollIntoView({behavior:"smooth",block:"nearest"})},50)}
function msList(){const sets=msSets(),nx=msNext();let lv=0;
  $("#app").innerHTML=`<div class="top"><button class="x" onclick="go('home')" aria-label="Close">${ic("x")}</button><b class="ttl">Mastery sets</b></div>
  <div class="mut">15 questions a set. Redo the ones you miss until a round is 100%, then the next set opens.</div>
  ${nx>=0?`<button class="cta" onclick="msOpen(${nx})"><span class="t">${ic("play")}Continue: Set ${nx+1}</span><span class="s">${LV[sets[nx].lv]} · ${esc(sets[nx].label)}</span></button>`:`<div class="why ok" style="margin-top:14px"><b>All ${sets.length} sets mastered.</b> Re-run any set below.</div>`}
  ${sets.map((st,i)=>{const f=msInfo(i),x=f.x,nw=st.ids.length-f.got;const stt=!f.open?"locked":f.mast?"mastered ✓":x&&x.passed?nw+" new":x?"in progress "+f.got+"/"+st.ids.length:"not started";
    const h=st.lv!==lv?(lv=st.lv,`<h2 class="ms-lv">${LV[st.lv]}</h2>`):"";
    return h+`<button class="mode ms-row${i===nx?" on":""}${f.mast?" done":""}" ${f.open?"":"disabled"} onclick="msOpen(${i})"><span class="ic">${i+1}</span><span class="tx"><b>Set ${i+1} · ${LV[st.lv]}</b><span>${esc(st.label)}</span></span><span class="ct${i===nx?" hot":""}">${stt}</span></button>`}).join("")}`;
  dock("")}
if(view==="home")render(); // app.js renders home before this file loads; redraw so the "Set N of M" pill shows

const KWFIX={"e1a9gukh": {"3": ["messy", "figuring out"]}, "ejf9bub": {"6": ["logged"]}, "egdn2uv": {"0": ["make things up", "pull numbers"]}, "el4hgnl": {"2": ["trick it", "tries to trick"]}, "etvx9iv": {"1": ["every trick", "no filter"]}, "eu3ay1u": {"4": ["will pay for it", "when a customer"]}, "e1632ekj": {"3": ["pays it back", "monthly fee"]}, "edlsiku": {"5": ["payment instructions"]}, "e1ntu3aw": {"3": ["job's done", "held back"]}, "e3mgqmo": {"0": ["isn't retrained", "not retrained"]}, "edjvzli": {"1": ["test set", "tricky cases"]}, "e1ml14mo": {"2": ["running over", "compares it"]}, "e6y8ftn": {"3": ["sounds right", "sound right"]}, "e15mvya1": {"3": ["no exit fee"]}, "exa0kpw": {"3": ["sticks to facts", "from the listing"]}, "e1xz6hvf": {"1": ["only gets", "records it needs"], "2": ["treated as data", "never as instructions"]}, "e1jdz23k": {"3": ["what happens to leads", "happens to leads"]}, "entg0ce": {"3": ["real cause", "instead of pulling"]}, "w1m0c98b": {"4": ["set it up"]}, "ofzlgd": {"0": ["who it helps most", "helps most"]}, "o1rbv6r1": {"1": ["talk to each other", "sees all three"]}, "oq7topd": {"2": ["logged", "fix the cause"]}, "oquw94u": {"2": ["keep running", "i build"], "3": ["your nights", "spend your"]}, "o1tmn6id": {"3": ["off their plate", "hire someone"]}, "o12tbbjk": {"2": ["you walk", "in writing"]}, "o1712bcu": {"3": ["logged"]}, "o1m1m3kr": {"1": ["matter most", "to him"]}, "owy7ipr": {"1": ["po number"]}, "oy7so0r": {"1": ["what eats", "the right thing"], "2": ["just for that", "your office"]}, "owdczra": {"1": ["so they just", "repetitive stuff"]}, "o1x3p7br": {"1": ["this is the job", "business i'm building"]}, "obugmb0": {"0": ["you're the one", "in charge"], "3": ["time back", "actually needs you"]}, "o3ncblf": {"1": ["where your team", "already works"]}, "e1te1b7i": {"2": ["only ask for", "what the agents need"]}, "e1uke1yu": {"1": ["tools they use", "what tools"]}, "ejvqudl": {"0": ["eats most", "after the crew"]}, "enhwqda": {"4": ["on the 1st", "switch the plan"]}, "wwrtkk3": {"3": ["please call", "call me"]}, "w1896af": {"5": ["if you want it", "want to talk"]}, "o15pbpvi": {"1": ["access they need", "only get the access"]}, "ouw2npa": {"1": ["my code", "send action"]}, "o17hiuku": {"3": ["text you", "reach out"]}};
ITEMS.forEach(i=>{const f=KWFIX[i.id];if(f)Object.entries(f).forEach(([k,a])=>{i.pts[k][1]=i.pts[k][1].concat(a)})});
