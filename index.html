["connect",4,"q","Which is TRUE about QuickBooks Online permissions?",["A read-only accounting scope blocks all writes on Intuit's side","Access starts read-only until the owner upgrades it in settings","Each agent's permissions are set by the owner inside QuickBooks","The scope is read+write; read-only is enforced by your code"],3,"Intuit's accounting scope is all-or-nothing. Your code limits what the agent can call."],
["connect",5,"drill","CPA: 'So the invoice drafts sit in QuickBooks until approval?' Accurate answer?",["'No. Drafts live in my dashboard; QuickBooks gets it after you approve.'","'Yes. QuickBooks holds them as drafts until you approve each one.'","'Yes, and they stay off your AR report until they're actually sent out.'","'No. They sit in your Gmail drafts folder until you approve them.'"],0,"QuickBooks Online has no draft invoices. Saving one through the API puts it on the books."],
["connect",4,"spot","Spot the mistake: 'We only use gmail.compose, so it's technically impossible for the agent to send.'",["gmail.compose can send too; draft-only is enforced by our code","Nothing wrong: gmail.compose only allows creating and editing drafts","Gmail has no scope that can create drafts, so this won't work","gmail.send would be the safer choice for a draft-only agent"],0,"Know where the guarantee actually comes from: your code, not Google."],
["agents",4,"q","A job is 70% complete by cost but only 40% billed. That's…",["Overbilling","Retainage","Underbilling","A healthy cash position"],2,"Work is earned but not invoiced. Invoicing should flag it."],
["legal",3,"q","An owner approves a draft with a wrong price and loses a job. What protects you most?",["A stricter system prompt that forbids the agent from quoting wrong prices","A disclaimer in the dashboard footer saying the AI can make mistakes","A contract that caps liability and puts approved outputs on the customer","Switching to a smarter model so wrong prices never get drafted again"],2,"Contracts handle the risk that's left after good design."],
["realestate",4,"spot","Listing draft: 'Quiet street, perfect for young families, walk to St. Mary's.' Problem?",["Fine: it's accurate, local, and helps buyers picture living there","Fair Housing risk: preference by familial status and religion","It's too long; good listing lines should stay under ten words total","The price and square footage should come first in any listing"],1,"Describe the property, not who should live there."],
["realestate",3,"drill","Realtor: 'Can it text every new lead automatically?' Best answer?",["'Yes. Every new lead gets a text within a minute, day or night, with no work from you.'","'Yes, as long as the lead typed a phone number into the form on your website.'","'Not yet. AI tools can't send text messages, only emails, so texting is out for now.'","'It drafts fast; you send, only to opted-in leads, because auto-texts risk TCPA fines.'"],3,"Speed AND consent. Fines are per message."],
["privacy",5,"q","Customer: 'Is my data gone the instant the AI reads it?' Accurate answer?",["'Yes. On business API plans, prompts are deleted as soon as the reply is sent back.'","'It's kept for a year and may be used for training unless you opt out in settings.'","'Often kept ~30 days for abuse checks unless zero-retention applies; here's the policy.'","'Only if the model makes a mistake; then it's saved so the provider can review the error.'"],2,"Be precise and show the source."],
["ops",5,"q","A bug shows Customer A's invoice summary in Customer B's dashboard. First move?",["Patch the filter and redeploy, then decide whether it's worth telling anyone","Ask Customer B to delete what they saw, then patch the bug quietly tonight","Roll back to yesterday's version and watch closely to see if it happens again","Pause agents, see what was exposed, tell Customer A promptly, then fix"],3,"Contain, find out what happened, disclose, fix. Hiding it ends the business."],
["realestate",2,"q","What does 'speed to lead' mean for a real estate team?",["How fast a new listing goes under contract","How fast someone replies to a new lead","How fast a new lead turns into a closed deal","How fast leads load into the team's CRM"],1,"Replying within minutes wins far more leads than replying hours later. Sales agent drafts instantly; agent approves."],
["ops",4,"q","A spam flood hits a customer's inbox overnight. What stops a big AI bill?",["A smarter model that ignores the spam emails","A daily spending cap and max steps per run","A lower temperature setting on the Email agent","A larger context window to batch the emails"],1,"Runaway-cost guards: cap spend per customer per day, cap steps per run, alert you."],
["legal",4,"q","Brokerage asks for SOC 2. You don't have it. Best move?",["Say you're 'SOC 2 aligned', since you already follow most of the same controls","Say not yet, share your security overview, DPA, MFA and logs, and respect a hard requirement","Promise to have SOC 2 done within 30 days so the deal doesn't stall while they wait","Steer away from the question and focus the call on how much time and money the agents will save them"],1,"Never fake certifications. Honesty plus what you DO have."],
["models",4,"q","A competitor launches an AI that's 10% better at email drafts. Because you built model-agnostic, you…",["Rebuild your agents from scratch around the new model's features","Swap the model setting, run your evals, ship if it's better","Wait a year to see whether the new model holds up in practice","Switch customers to the new model once its public benchmarks check out"],1,"That's the point of model-agnostic: test and swap in days."],
["safety",1,"spot","Spot the mistake: 'The Invoicing agent sends invoices on its own the moment a job is marked done.'",["Nothing wrong: invoices going out faster means getting paid faster too","It skips owner approval, so a wrong invoice goes straight to the customer","Invoices should only go out once a month in a batch, not after each job","It should text the invoice instead, since customers read texts faster"],1,"Draft-only: the agent prepares, the owner approves."],
["sales",1,"spot","Spot the mistake: 'Hi, I sell LLM-powered agentic automation for SMB back-office workflows.'",["Nothing wrong: it's accurate, and it makes you sound established","A contractor won't know what that means; say what it does for them","It's too short; add more detail about the technology behind it","It should open with the monthly price so they can decide fast"],1,"Plain words: 'I build you an assistant that chases estimates and late invoices for you.'"],
["privacy",2,"spot","Spot the mistake: 'I'll email you the dashboard login password so you can share it with your crew.'",["Nothing wrong, as long as the password is long and changed every month","Shared passwords leak and can't be traced; each person needs their own login","It should be sent by text message instead, since texts are more secure","Crew members should never get dashboard access, only the owner should"],1,"Each person gets their own identity-based access through the login gate, and you can remove one person without changing everything."],
["models",5,"spot","Spot the mistake: 'Let the model add up the line items and tax so the invoice total is always right.'",["Fine if temperature is set to 0 so the math stays consistent","Models can slip on arithmetic; totals should come from QuickBooks or code","Tax should be left off invoices and handled on a separate statement","Only open-source models running locally can do invoice math reliably"],1,"The model writes words; code and QuickBooks do the numbers."],
["safety",5,"spot","Spot the mistake: 'The Email agent can read every inbox, see all invoices, and post to any web address so it can look things up.'",["Fine if the system prompt tells it to keep customer data private","Lethal trifecta: private data, untrusted emails, and a way to send data out","It also needs Outlook access so it can cover every customer's inbox too","Web lookups are too slow, so it should use a cached copy of each site"],1,"Remove a leg: no outbound sending or arbitrary web requests from the agent that reads untrusted email."],
["sales",1,"drill","A plumber asks: 'So do I have to learn some new program?'",["'Yes, but it's easy. Most people get the hang of it in a week or so.'","'No. You check drafts on your phone and tap approve. I handle setup.'","'Only if you want the advanced features. The basics run on their own.'","'You'll need a two-hour training session, then you're good to go.'"],1,"Remove effort and fear in one line."],
["sales",1,"drill","An electrician says: 'How fast would I see anything?'",["'It takes about a year before the AI learns your business well enough to help you.'","'You'd see drafts and your dashboard within a few weeks, starting with your biggest headache.'","'Instantly. The day you sign, you'll have every agent up and running, guaranteed.'","'It depends on the AI. Some customers see results really fast, while others take a lot longer to get there.'"],1,"Realistic timeline, no guarantees, start with the biggest pain. (Only quote a timeline you can actually hit.)"],
["sales",5,"drill","Mid-call, a GC asks: 'Give me one real customer I can call.' You don't have one yet.",["Give a friend's name and number, and ask the friend to vouch for your work on the call","'Honestly, you'd be one of my first, so I start with a paid pilot on one agent using your own numbers.'","'I can't share client info for privacy reasons, but I'm happy to send over some written reviews from past work.'","Change the subject to the ROI numbers and plan to circle back to references at the very end"],1,"Never fake references. Turn 'first customer' into a low-risk pilot. (Telling him you can't share client info when you have none would be deceptive.)"],
["realestate",5,"drill","A broker asks: 'Can your agent decide which leads my team should ignore?'",["'Yes. It scores each lead and archives the low scorers, so your team only works the top of the list.'","'It can score and sort leads and explain why, but your team decides; nothing is deleted, and scoring never uses protected traits.'","'Yes. It's trained on millions of past real estate leads, so it already knows which ones are worth your team's time and which aren't.'","'Yes, as long as it scores leads on zip code alone, since that keeps the ranking neutral under Fair Housing.'"],1,"Helpful, human-decides, and Fair Housing-safe: never score on race, religion, family status or other protected traits."]
];
// Explain-it-back: {t, lv, q, pts:[[label, [keywords...]]], model}
const EXPLAIN = [
{t:"basics",lv:1,q:"Explain what an AI agent is to a contractor who's never used AI.",pts:[["Acts, not just chats",["tool","act","does","action","task"]],["Works toward a goal in steps",["step","goal","loop","until"]],["Uses their real apps/data",["quickbooks","email","gmail","data","app"]]],model:"It's like an office assistant that lives in your computer. Instead of just answering questions, it actually does tasks: it reads your email and QuickBooks, figures out what needs doing, and works through it step by step. Like drafting a reminder for an overdue invoice."},
{t:"basics",lv:2,q:"Explain the difference between a workflow and an agent, and when you'd use each.",pts:[["Workflow = fixed steps set by code",["fixed","same","order","code","predict"]],["Agent = model decides next step",["decide","model","choose","flexible","own"]],["Workflows for predictable tasks",["predict","repeat","cheap","reliable"]],["Agents for open-ended tasks",["open","complex","unusual","different"]]],model:"A workflow follows the same steps every time, in an order my code sets, like 'job marked done → draft review request'. An agent lets the AI decide what to do next, which is better for messy tasks like figuring out what an email needs. Workflows are cheaper and more reliable, so I use them whenever the task is predictable."},
{t:"basics",lv:3,q:"Walk through what happens, step by step, when the Email agent processes one new email.",pts:[["Trigger: new email arrives",["trigger","arrive","new email","webhook"]],["Reads email + context",["read","context","history"]],["Classifies it",["sort","classif","categor","label","tag"]],["Calls tools for data",["tool","quickbooks","lookup","call"]],["Drafts reply / hands off",["draft","hand","pass","route"]],["Human approves",["approve","owner","review","human"]],["Logs it",["log","record","audit"]]],model:"New email triggers the agent. It reads the email plus the thread history, classifies it (lead, invoice question, supplier, spam), calls tools if it needs data, like looking up the invoice in QuickBooks, then drafts a reply or hands a summary to the right agent. The draft waits for the owner to approve, and everything gets logged."},
{t:"basics",lv:4,q:"Why do agents fail, and what do you do about each cause?",pts:[["Hallucination → ground in tool data",["hallucin","made up","ground","source"]],["Missing/bad context",["context","information","missing"]],["Compounding errors over many steps",["step","compound","chain","multiply"]],["Tool/API failures",["api","tool","fail","expire","429","rate"]],["Prompt injection",["inject","attack","hidden"]],["Fixes: approvals, evals, logs, fewer steps",["approv","eval","log","test","simple"]]],model:"They make things up, so I pull numbers from tools and keep drafts reviewed. They lack context, so I debug by checking exactly what they saw. Errors compound over many steps, so I keep chains short. APIs fail or tokens expire, so I add retries, alerts, and reconnect prompts. Prompt injection, so I limit power. And I run evals and keep logs to catch problems."},
{t:"agents",lv:2,q:"Pitch the Invoicing agent's value in under 30 seconds.",pts:[["Drafts invoices when job done",["draft","invoice","job","done","complete"]],["Chases overdue politely",["remind","overdue","late","chase","follow"]],["You approve",["approve","you","review"]],["Outcome: paid faster / cash",["faster","cash","paid","days","money"]]],model:"When a job's done, it drafts the invoice from your QuickBooks data. When someone's late, it drafts a polite reminder. You just tap approve. The goal: you get paid faster without the awkward phone calls."},
{t:"agents",lv:3,q:"Explain job costing and how the Cost Center agent helps.",pts:[["Costs tracked per job",["per job","each job","specific job"]],["Materials, labor, subs",["material","labor","sub"]],["Compare to estimate",["estimate","budget","compare","actual"]],["Flags overruns / margin",["flag","over","margin","profit","losing"]],["Data from QuickBooks",["quickbooks","expense","bill"]]],model:"Job costing means tracking every cost (materials, labor, subs) against each specific job, so you know which jobs actually make money. The Cost Center agent pulls expenses from QuickBooks, tags them to jobs, compares actual vs the estimate, and flags jobs going over budget or with thin margins."},
{t:"connect",lv:3,q:"Explain OAuth and scopes to a customer worried about giving you access.",pts:[["No password shared",["password"]],["They approve on QuickBooks/Google's own screen",["approve","screen","sign in","connect","google","quickbooks"]],["Limited permissions (scopes)",["limit","scope","permission","only"]],["Can revoke anytime",["revoke","disconnect","cancel","remove","anytime"]]],model:"You never give me your password. You click 'Connect' and approve it on QuickBooks' or Google's own screen. You'll see exactly what access is being asked for, and I only ask for what the agents need. You can disconnect it anytime from your account settings."},
{t:"connect",lv:4,q:"Explain why adding Gmail is harder than adding QuickBooks for your business.",pts:[["Restricted scopes (even read/draft)",["restrict","scope","readonly","compose"]],["Google verification",["verif","google review","approval"]],["Security assessment CASA yearly",["casa","assessment","audit","security","yearly","annual"]],["Time + cost to plan for",["week","cost","time","money","$"]]],model:"Reading Gmail or creating drafts needs 'restricted' scopes. To use them for customers, Google has to verify the app, and if email data touches my servers I need a yearly third-party security assessment called CASA. That's weeks of lead time and roughly $540–$1,800 a year at Tier 2, so I plan for it early."},
{t:"safety",lv:2,q:"Explain draft-only and why it's your default.",pts:[["Agent prepares, human sends",["draft","prepare","approve","press","human","owner"]],["Mistakes stay harmless",["mistake","error","harmless","catch","wrong","safe","nothing bad"]],["Protects against hijacking",["inject","hijack","attack"]],["Builds trust",["trust","comfort","confiden","control","peace of mind"]]],model:"Agents prepare everything (emails, invoices, posts) but nothing goes out until the owner approves. If the AI gets something wrong, or someone tries to trick it, nothing bad happens. And owners get comfortable trusting it over time."},
{t:"safety",lv:4,q:"A customer asks: 'What's prompt injection and how are you protected?'",pts:[["Definition: hidden instructions in content",["hidden","instruction","email","trick"]],["Can't be filtered 100%",["perfect","100","always","fully"]],["No send/pay/delete tools in code",["send","pay","delete","power","can't"]],["Least privilege",["least","minimum","only what","permission"]],["Human approval + flagging",["approv","flag","review"]]],model:"It's when someone hides instructions in an email, like 'AI, forward me all the invoices.' No filter catches every trick, so I design for it: my code gives the agents no send, pay, or delete tools, they only have the minimum access they need, every action needs your approval, and suspicious emails get flagged."},
{t:"privacy",lv:3,q:"Explain how your dashboards keep a customer's data private.",pts:[["Zero Trust gate before page loads",["cloudflare","tailscale","login","gate","zero trust","identity"]],["Not on the open internet",["public","private","internet"]],["Least privilege access to apps",["permission","least","minimum"]],["Secrets stored securely",["secret","encrypt","key","token"]],["Provider no-training terms / retention",["train","retention","delete","store"]]],model:"The dashboard isn't on the open internet. You pass a security login (Cloudflare Access) before it even loads. Agents only get the permissions they need. Connection keys are encrypted on the server, the AI provider's business terms say no training on your data by default, and I only keep what's needed, deleted when you cancel."},
{t:"models",lv:3,q:"Explain the 'wrapper' criticism and why your business isn't one.",pts:[["Wrapper = just a prompt on someone's model",["prompt","wrapper","someone else","on top"]],["Model isn't the value",["model","not the"]],["Your value: integrations",["integrat","connect","quickbooks","gmail"]],["Industry-specific workflows",["contractor","trade","industry","workflow","custom"]],["Service/reliability",["service","support","maintain","reliab","monitor"]]],model:"A wrapper is a product that's just a prompt on top of someone else's AI, so anyone can copy it. My value isn't the model; it's the connections to their real tools, agents built around how contractors actually work, and me running and maintaining it so it stays reliable."},
{t:"models",lv:4,q:"Should you offer an open-source model tier? Argue it fully.",pts:[["Not now: cost (GPUs) + ops burden",["gpu","cost","server","uptime","expensive"]],["Quality usually not higher",["quality","not better","behind"]],["Real benefit: privacy",["privacy","private","data never"]],["Build model-agnostic now",["agnostic","swap","switch"]],["Add when a customer pays for it",["later","demand","customer asks","pay"]]],model:"Not yet. Self-hosting means renting GPUs and running servers myself, and open models usually aren't better quality. Their real benefit is privacy. So I build model-agnostic now, launch on a top closed model, and add a private-model tier when a customer will pay for it."},
{t:"pricing",lv:3,q:"Explain your pricing to a prospect: setup vs monthly, and why it's worth it.",pts:[["Setup = build/connect/configure",["setup","build","connect","configure","one-time"]],["Monthly = running, AI costs, monitoring, improving",["monthly","run","monitor","support","improv","hosting"]],["Tie to value / ROI",["save","worth","hours","cash","pay back","roi","value"]],["Low-risk start (pilot/cancel)",["pilot","cancel","trial","start small"]]],model:"There's a one-time setup to connect your tools and configure the agents for your business, then a monthly fee that covers running it, the AI costs, monitoring, and improvements. If it saves you even a few hours a week or one lost job, it pays for itself. We can start with a paid pilot on one agent."},
{t:"pricing",lv:5,q:"Build a value case: an owner spends 8 hrs/week on office work at $75/hr, has $30k in late invoices, loses ~2 leads a month worth $5k each.",pts:[["Time: ~$2,400–2,600/month",["2,400","2400","2,600","2600","32 hours","35 hours"]],["Cash: faster collection of late $",["30","cash","collect","late"]],["Leads: $10k/month at risk",["10,000","10k","10000","lead"]],["Compare to your price / payback",["payback","price","cost","pays for"]]],model:"8 hrs × $75 = $600/week, about $2,600/month of owner time. $30k stuck in late invoices: collecting even part of it faster is real cash. 2 lost leads × $5k = $10k/month of jobs walking away. Against a $495–$650 monthly fee, saving even a fraction pays it back in weeks."},
{t:"sales",lv:2,q:"Give your 20-second elevator pitch to a contractor.",pts:[["Who it's for (contractors)",["contractor","trade","roof","plumb","electric","hvac","your business"]],["Problem (office work, slow pay, lost leads)",["office","night","paperwork","late","lead","admin"]],["What it does",["dashboard","draft","follow","invoice","agent","assistant"]],["Control: you approve",["approve","you control","review"]],["Outcome",["paid","jobs","time","hours","money"]]],model:"I build contractors a private dashboard with AI assistants that handle the office work after the crew goes home: following up on estimates, drafting invoices and reminders, and showing which jobs make money. You approve everything with a tap. You win more jobs and get paid faster without working nights."},
{t:"sales",lv:3,q:"How would you run a discovery call? List your flow.",pts:[["Ask about their day/pain",["pain","day","after hours","what eats","problem"]],["Tools they use",["tool","quickbooks","jobber","software","use"]],["Quantify (numbers)",["how many","how long","number","quantif","$"]],["Listen more than talk",["listen","ask","question"]],["Next step / pilot",["next step","pilot","proposal","follow"]]],model:"Ask about their week and what eats their time, what tools they use, then put numbers on the pain: how many estimates go unanswered, how long to get paid. I mostly listen. Then I recap their problems in their words and propose a next step, like a paid pilot on the biggest pain."},
{t:"compete",lv:3,q:"A prospect uses Jobber + QuickBooks. Position your dashboard against their built-in AI.",pts:[["Acknowledge built-in AI is good",["good","great","useful","acknowledge","fair"]],["Built-in mostly works inside its own app",["own app","one app","only sees","inside","separate","together"]],["You connect everything in one place",["one place","all","connect","together","both"]],["Custom to them + you maintain it",["custom","your business","maintain","support","set up"]],["Private",["private","secure"]]],model:"Jobber's and QuickBooks' AI are good inside their own apps. But neither ties everything together. I tie Jobber, QuickBooks, and your email into one private dashboard, so an agent can see that a job's done, the invoice isn't sent, and the customer just emailed. Plus it's set up for your business, and I maintain it."},
{t:"ops",lv:4,q:"Explain how you'd safely improve an agent after launch.",pts:[["Collect real examples / feedback",["example","feedback","edit","approval rate"]],["Eval set",["eval","test"]],["Version prompts",["version","roll back","change"]],["Monitor after release",["monitor","watch","log","alert"]],["Expand autonomy slowly",["slow","gradual","autonomy","step"]]],model:"Collect real examples where the owner edited or rejected drafts, add them to my eval set, change the prompt, and run the evals before shipping. Prompts are versioned so I can roll back. I watch logs and approval rates after release, and only expand autonomy slowly for low-risk, reversible tasks."},
{t:"agents",lv:1,q:"Name your 5 agents and say what each one does in one line.",pts:[["Sales: leads + estimate follow-ups",["sales"]],["Marketing: reviews, posts, lead sources",["marketing"]],["Cost Center: job costs vs estimate",["cost"]],["Invoicing: invoices + overdue reminders",["invoic"]],["Email: sorts inbox + drafts replies",["email","inbox"]]],model:"Sales follows up on leads and estimates so nothing goes cold. Marketing drafts review requests and posts and shows which lead sources pay. Cost Center tracks what each job really costs versus the estimate. Invoicing drafts invoices and polite reminders on late ones. Email sorts the inbox and drafts replies. All drafts, you approve."},
{t:"safety",lv:5,q:"Design the Email agent's security from scratch. Walk through every layer.",pts:[["Least-privilege scopes (and Gmail compose caveat)",["scope","compose","least","modify","readwrite"]],["No send tool in code",["no send","never send","send tool","block"]],["Email text treated as data; injection flagged",["inject","data","flag","suspicious"]],["Break the lethal trifecta (no outbound)",["trifecta","outbound","exfil","web request","send data"]],["Tenant isolation",["isolat","separate","customer a","other customer"]],["Secrets in a vault, not prompts",["secret","vault","token","encrypt"]],["Logs, kill switch, spend caps",["log","kill","cap","pause"]]],model:"Minimal scopes: on Gmail, compose can also send, so my code exposes no send tool; on Outlook I skip Mail.Send. Email text is treated as data and suspicious messages are flagged. My code gives the agent that reads untrusted email no outbound path (no send tool, no web requests), which breaks the lethal trifecta. Each customer's data, tokens and memory are isolated. Secrets live encrypted on the server, never in prompts. Everything is logged, with a kill switch and daily spend caps."},
];

// Objection handling: {lv, who, obj, pts, model}
const OBJECTIONS = [
{lv:2,who:"Electrician",obj:"Sounds like something I'd have to babysit.",pts:[["Empathize",["understand","fair","get it","hear"]],["Daily effort is tiny (glance + approve)",["minute","glance","approve","phone"]],["You monitor and fix it",["i watch","i monitor","i fix","i handle","maintain"]]],model:"Fair worry. Day to day it's a couple of minutes: glance at drafts on your phone and approve. Keeping it running is my job. I watch it, fix issues and tell you if something needs you."},
{lv:1,who:"Handyman",obj:"I'm too small for this. It's just me and one helper.",pts:[["Small is the point",["small","solo","just you","exactly"]],["Saves the owner's own hours",["hours","night","time","weekend"]],["Start with one agent",["one agent","start small","pilot","just invoic"]]],model:"Honestly, that's who it helps most, because you're doing the office work yourself at night. We'd start with one agent on your biggest headache, like chasing estimates or late invoices, and see if it earns its keep."},
{lv:1,who:"Roofer",obj:"I'm not a computer guy. This sounds complicated.",pts:[["Empathize",["understand","fair","get it","totally"]],["You do the setup",["i set","i do","set it up","handle"]],["Simple daily use (tap approve)",["tap","approve","phone","simple","easy"]]],model:"Totally get it. You don't have to be. I set everything up and connect it. Day to day you just look at drafts on your phone and tap approve. If you can text, you can use this."},
{lv:1,who:"Plumber",obj:"I don't trust AI with my customers.",pts:[["Validate",["fair","understand","smart","right"]],["Nothing sends without approval",["approve","nothing","without you","you see"]],["You can edit / turn off",["edit","change","pause","off"]]],model:"That's a smart instinct. That's why nothing goes to a customer unless you approve it. You see every draft, can edit it, and can pause any agent with one tap."},
{lv:2,who:"Electrician",obj:"How much does it cost?",pts:[["Ask/anchor on value first",["depends","how many","what's it worth","save","cost you"]],["Give a clear range/structure",["setup","monthly","$"]],["Offer low-risk start",["pilot","start","one agent","cancel"]]],model:"Depends on which agents you need. Can I ask how many estimates go unanswered a month? Typically it's a one-time setup plus a monthly fee, and most start with a paid pilot on one agent so you can see results first."},
{lv:2,who:"HVAC owner",obj:"I already have QuickBooks and Jobber. Why do I need you?",pts:[["Acknowledge their tools",["good","great","keep","already"]],["Gaps between apps",["between","each only","doesn't talk","separate","one place"]],["Concrete example",["job","invoice","email","lead","example"]],["Service",["set up","maintain","me","support"]]],model:"Keep them, they're good. The problem is they don't fully talk to each other. Job's done in Jobber, invoice isn't sent in QuickBooks, customer's asking in your email. My dashboard sees all three, and I maintain it for you."},
{lv:3,who:"Remodeler",obj:"What happens if the AI makes a mistake on an invoice?",pts:[["Draft-only + approval",["draft","approve","review"]],["Numbers come from QuickBooks",["quickbooks","pulled","source","real data"]],["Logs + you fix fast",["log","fix","track","record"]]],model:"It's built so it can only draft. Nothing goes out until you tap approve. The numbers come straight from your QuickBooks, not from the AI's guesswork, and every draft is logged, so if something's off you'll catch it before it goes out and I'll fix the cause."},
{lv:3,who:"Landscaper",obj:"Is my data safe? I don't want my numbers floating around the internet.",pts:[["Private dashboard behind login gate",["private","login","gate","cloudflare","not public"]],["Minimal permissions",["permission","only","minimum"]],["Provider terms / retention / delete",["train","delete","store","retention"]],["Offer to show details",["show","walk","explain","document"]]],model:"Your dashboard isn't on the public internet. You have to pass a secure login before it loads. Agents only get the access they need, the AI provider doesn't train on your data under their business terms, and I delete your data if you cancel. Happy to walk you through exactly what's stored."},
{lv:3,who:"Concrete contractor",obj:"I'll just use ChatGPT myself.",pts:[["Agree it's useful",["great","useful","good","helpful","fine for","sure"]],["Difference: connected + automatic + daily",["connect","automatic","every day","every morning","daily","runs","your data","quickbooks","on its own"]],["You maintain it",["maintain","fix","i handle","keep it working"]],["Time cost of DIY",["time","hours","yourself"]]],model:"ChatGPT's great for questions. But it doesn't log into your QuickBooks every morning, catch the overdue invoices, and have reminders waiting for you. That's what I build and keep running, so your nights stay free."},
{lv:4,who:"GC (general contractor)",obj:"You're one guy. What if you go out of business?",pts:[["Respect the question",["fair","good question","respect","understand"]],["No lock-in: data stays in their apps",["your data","stays","quickbooks","lock"]],["Documented setup",["document","written","handoff"]],["Month-to-month / cancel",["cancel","month","contract"]]],model:"Fair question. Your records stay in your own QuickBooks and email. I only keep what the agents need to run, and I delete it if you cancel. The setup is documented so someone else could take it over, and it's month-to-month, so you're never stuck."},
{lv:4,who:"Painter",obj:"$495 a month? I could hire a part-time office person.",pts:[["Compare honestly",["part-time","office person","hire"]],["Cost comparison with numbers",["$","hour","month","cheaper","less"]],["Works 24/7, no training/turnover",["24","night","sick","quit","training","always"]],["Can complement a person",["together","help them","both","alongside"]]],model:"You could. A part-timer at 15 hours a week at $20 is about $1,300 a month, they're not there at night, and they need training. Plus is $495 a month and runs every day, and if you hire someone later, it takes the repetitive stuff off their plate."},
{lv:4,who:"Roofer",obj:"I've been burned by tech companies before. Contracts, hidden fees…",pts:[["Empathize",["sorry","understand","heard","fair"]],["Transparent pricing in writing",["writing","clear","no hidden","everything"]],["No long contract",["month","cancel","no contract"]],["Paid pilot to prove it",["pilot","prove","first"]]],model:"I hear that a lot, and it's fair. Everything's in writing up front, no hidden fees, month-to-month. Start with a small paid pilot on one agent, and if it doesn't earn its keep, you walk."},
{lv:5,who:"Skeptical CPA advising a client",obj:"AI agents hallucinate. You can't let them near financial records.",pts:[["Agree hallucination is real",["right","agree","real","true"]],["Read-only + draft-only design",["read","draft","can't change","approve"]],["Numbers from source, not model",["source","quickbooks","pulled","structured"]],["Audit log",["log","audit","trace"]],["Invite review",["review","look","show you","check"]]],model:"You're right, they do. That's why my code only lets these agents read the books (the QuickBooks permission itself allows writes, so the limit is in my code and it's logged), and anything outgoing is a draft until approved. Numbers are pulled from QuickBooks through the API, not generated. Every draft and approval is logged, and I'd welcome you reviewing the setup."},
{lv:5,who:"Tech-savvy owner",obj:"Isn't this just a wrapper around ChatGPT or Claude?",pts:[["Honest: yes, uses a top model",["yes","use","claude","model","honest"]],["Value is the system: integrations",["connect","integrat","quickbooks"]],["Built for contractors",["contractor","trade","your workflow"]],["Reliability + maintenance",["maintain","monitor","reliab","keep"]],["Model-agnostic",["swap","switch","best model","agnostic"]]],model:"Honestly, it uses a top model like Claude under the hood, same as most serious AI products. The value isn't the model; it's the connections to your tools, agents built around how contractors work, and me keeping it reliable. And I can switch to whatever model is best next year."},

{lv:4,who:"Brokerage owner (real estate)",obj:"Do you have SOC 2? We require vendor security reviews.",pts:[["Honest: not yet",["not yet","don't have","honest"]],["Why: cost/time for a small vendor",["audit","months","expensive","cost"]],["What you DO have",["dpa","subprocessor","mfa","zero trust","logs","least privilege"]],["Respect a hard requirement",["requirement","not the right fit","understand"]]],model:"Not yet. SOC 2 is an audit that costs a lot and takes months. What I can give you today: a written security overview, a DPA, my subprocessor list, MFA and Zero Trust login, least-privilege access and audit logs. If SOC 2 is a hard requirement, I'm honestly not the right fit yet."},

// ===== New sections: sales process, proposals & invoices, setup =====
CARDS.push(
// ---------- SALES PROCESS ----------
["process",1,"The first 5 stages of your sales process?","1 Find leads → 2 First contact → 3 Discovery → 4 Demo → 5 Proposal. (Then: objections, close, onboarding, invoice, keep and grow.)"],
["process",2,"The 10 stages of your sales process?","1 Find leads → 2 First contact → 3 Discovery → 4 Demo → 5 Proposal → 6 Objections → 7 Close → 8 Onboarding → 9 Invoice → 10 Keep, upsell, get referrals."],
["process",1,"What is a lead vs a prospect vs a customer?","Lead = someone who might need you. Prospect = a lead you've confirmed has the problem, the budget and the authority to buy. Customer = signed and paying."],
["process",1,"Where do your first leads come from?","Warm connections first: construction people you know, your dad's industry contacts (with his OK), suppliers, trade groups, then referrals. Cold outreach comes after."],
["process",1,"What's the goal of the first contact?","Not to sell. Get a short call or meeting to learn about their business. One clear ask: 'Got 15 minutes this week?'"],
["process",1,"What is a pipeline?","The list of every deal and which stage it's in (contacted, discovery done, proposal sent, won, lost). It tells you what to do next and how much money is coming."],
["process",2,"What should a first outreach message include?","Who you are, why them specifically, one problem you solve in their words, and one small ask. Under 100 words. No jargon, no attachments."],
["process",2,"Follow-up rule of thumb?","Most deals need several touches. Follow up a few times, spaced out, each adding something new (a useful idea, a short example). Stop if they say no, and log every touch."],
["process",2,"What does a good demo show?","THEIR problem being solved: a dashboard with a contractor's kind of numbers, a drafted overdue reminder, a stale-estimate list. 15 minutes max, built around what they said in discovery."],
["process",2,"Demo with real or fake data?","Fake but realistic (sandbox) data. Never show another customer's real data in a demo."],
["process",2,"What is a proposal?","A document that recaps their problems, your solution, exactly what's included, price, timeline, and terms, ending with how to say yes. It's what they sign."],
["process",2,"What is closing?","Asking for the decision. 'Want to start with the Invoicing pilot on the 15th?' Then stop talking and let them answer."],
["process",3,"What is BANT?","A qualification check: Budget (can they pay?), Authority (are they the decision maker?), Need (real problem?), Timing (when?). Skip or park the ones who fail it: a Timing 'no' goes on a follow-up list, not the trash."],
["process",3,"Discovery: what must you leave knowing?","Their top 2–3 pains with numbers, the tools they use, who decides, budget range, timeline, and what success looks like to them."],
["process",3,"What is a 'next step' and why always set one?","A specific, scheduled action ('demo Tuesday 3pm'). Deals without a next step on the calendar usually die."],
["process",3,"Assumptive close vs choice close?","Assumptive: 'I'll send the agreement for a start on the 15th.' Choice: 'Want to start with Invoicing or Sales?' Both move to action without a yes/no question."],
["process",3,"What is onboarding?","Everything between 'yes' and 'live': signed agreement, deposit, intake form, connecting their tools, building their profile, sandbox testing, training the owner, go-live."],
["process",3,"Why take a deposit before starting the build?","It confirms commitment and covers your early work. Common: 50% of setup at signing, the rest at go-live."],
["process",4,"What is a win/loss review?","After every deal, write down why you won or lost. Patterns tell you what to fix in your pitch, pricing or targeting."],
["process",4,"What is churn, and how do you prevent it?","Customers canceling. Prevent it with a monthly results recap (hours saved, faster payments), quick fixes, and regular check-ins."],
["process",4,"How do you upsell the right way?","When an agent is clearly working, show the result and offer the next one tied to a pain they already mentioned. Never push agents they don't need."],
["process",4,"How do you ask for referrals?","Right after a visible win: 'Glad invoicing is faster. Know another contractor drowning in paperwork?' Make it easy: offer to send them a short intro text."],
["process",3,"Your sales math: why track conversion rates by stage?","Leads → calls → proposals → wins. If 20 calls make 5 proposals that make 2 wins, you know 10 calls ≈ 1 customer and can plan your week. Fix the weakest stage first."],
["process",3,"What is customer lifetime value (LTV)?","Monthly fee × months they stay (+ setup). $500/mo × 24 months + $3,000 setup = $15,000 revenue. To decide what you can spend to win a customer, use PROFIT LTV (minus AI, hosting and your time) and keep acquisition cost at or below about 1/3 of it."],
// ---------- PROPOSALS & INVOICES ----------
["invoicing",1,"Quote vs proposal vs invoice?","Quote: just a price for specific work. Proposal: the full pitch with scope, price and terms, to be accepted. Invoice: a bill for work agreed or done, asking for payment."],
["invoicing",1,"Must-haves on every invoice?","Your business name and contact, client name and address, invoice number, invoice date, due date/terms, itemized lines (description, qty, rate, amount), subtotal, tax, total, balance due, how to pay."],
["invoicing",1,"What does 'Net 30' mean?","Payment is due 30 days after the invoice date."],
["invoicing",1,"What does 'Due on receipt' mean?","Payment is expected as soon as the client gets the invoice."],
["invoicing",1,"What is a line item?","One row on the invoice: what it is, quantity, unit rate, and amount (qty × rate)."],
["invoicing",2,"Why must invoice numbers be unique and in order?","So you and the client can track, reference and audit each one. Duplicates or gaps cause confusion and accounting problems. Example format: DSH-2026-0042."],
["invoicing",2,"Subtotal vs total vs balance due?","Subtotal = sum of line items. Total = subtotal − discounts + tax. Balance due = total − payments or deposits already received."],
["invoicing",2,"What is '2/10 Net 30'?","2% discount if paid within 10 days; otherwise the full amount is due in 30 days."],
["invoicing",2,"Setup fee vs recurring line on YOUR invoice?","Show them separately: 'Implementation: Invoicing + Sales agents (one-time)' and 'Monthly service: Pro plan, Dec 1–31'. Always show the service period for recurring lines."],
["invoicing",2,"How should you show a deposit already paid?","As its own line after the total: 'Less: deposit received 11/3 (Inv DSH-0041)', with the balance due below it. Never just lower the prices."],
["invoicing",2,"What is a PO number?","A purchase order number the client's company issues. Bigger clients often won't pay an invoice without their PO number on it."],
["invoicing",3,"How should a discount appear?","As its own negative line with a reason ('Pilot discount, 10%'), so the full value stays visible. Calculate tax per your state's rules for discounts."],
["invoicing",3,"Is labor taxed like materials?","Depends on the state and the type of work. Example: Washington taxes the whole residential construction job, labor included; Idaho contractors pay tax on materials when they BUY them and don't charge homeowners sales tax. Oregon has no general sales tax. Always check the state rules or the client's accountant."],
["invoicing",3,"Do you charge sales tax on your own dashboard service?","Depends on the client's state. Some states tax software or SaaS, others don't; Oregon has no sales tax. Check before invoicing out-of-state clients and confirm with an accountant."],
["invoicing",3,"Why itemize instead of one lump sum?","Itemizing shows value, makes approval easier for the client's office, cuts disputes ('what is this $9,000?'), and makes it easy to match against the proposal."],
["invoicing",3,"What is progress billing math?","Contract sum to date (original + approved change orders) × % complete = work completed to date. Minus retainage, minus previous billing = current amount due."],
["invoicing",3,"What is a change order line on an invoice?","A separate, labeled line ('CO #2: add attic baffles, approved 10/14') billed at the approved amount. Never hide changes inside original lines."],
["invoicing",4,"What are AIA G702 and G703?","Standard commercial construction pay application forms. G702 is the summary (contract sum, completed to date, retainage, amount due); G703 is the line-by-line continuation sheet. Big GCs often require them."],
["invoicing",4,"Retainage math example?","$200,000 contract, 40% complete = $80,000 earned. 10% retainage = $8,000 held. Previously billed (net) $45,000. Current due = $80,000 − $8,000 − $45,000 = $27,000."],
["invoicing",4,"Conditional vs unconditional lien waiver?","Conditional: you give up lien rights only once the payment actually clears. Unconditional: rights given up immediately, so only sign it after the money is in your account. Some states require their own official forms (like CA and TX); others (like OR and WA) don't. Read the wording before signing."],
["invoicing",4,"What is a late fee clause?","Terms (agreed in advance, in the contract) for a fee on overdue invoices. Legal limits vary by state, so put it in your agreement and keep it reasonable."],
["invoicing",4,"Proposal must-haves for a big client?","Problem recap in their words, scope (included AND excluded), deliverables per phase, timeline, itemized price, payment schedule, assumptions, terms reference, expiry date, signature block."],
["invoicing",5,"Why put an 'Exclusions' section in a proposal?","It prevents scope creep: 'Not included: QuickBooks Desktop, text messaging, custom reports beyond 3.' Disputes happen over what wasn't written down."],
["invoicing",5,"How do you handle a client disputing one line?","Pay-what's-undisputed: ask them to pay the undisputed lines now, then resolve the disputed line with documentation (proposal, change order, approvals). Don't void the whole invoice."],
["invoicing",5,"Card vs ACH fees on your invoices?","Stripe charges about 2.9% + 30¢ per US card payment; ACH is 0.8% capped at $5. On a $10,000 invoice that's about $290 vs $5, so push ACH for big invoices. Card surcharges have rules that vary by state and card network (and aren't allowed on debit cards)."],
// ---------- SETUP / IMPLEMENTATION ----------
["setup",1,"Do you 'train' the AI on a customer's business?","No. You give it their info at run time: a business profile in its instructions, live connections to their tools, and sometimes a searchable library of their docs. The model itself doesn't change."],
["setup",1,"What is a sandbox?","A safe test copy with fake data where mistakes don't matter. You build and test there before touching a real customer's tools."],
["setup",1,"What goes in a customer profile?","Business name, trade, service area, services and price ranges, payment terms, tone of voice, who approves what, key contacts, and hard rules ('never offer discounts', 'never mention competitor X')."],
["setup",2,"Where does a customer profile live?","In your system, per customer, as structured data (like a JSON/markdown file or a database row). Your code loads it into the agent's instructions each run. One customer's profile is never loaded for another."],
["setup",2,"What is an intake form?","The questionnaire a new customer fills out (or you fill out together on a call) to build their profile: services, prices, terms, tone, tools used, which accounts to connect (the owner authorizes each one himself on the official sign-in screen; never collect passwords), approval rules."],
["setup",2,"What sandbox does Intuit give developers?","Free QuickBooks Online sandbox companies with sample data, created from the Intuit Developer portal. They're separate from real companies, so you can test safely. Your development keys only work on sandbox companies; real customers need production keys."],
["setup",2,"Sandbox for email?","A separate test Gmail or Outlook account you own, filled with realistic fake emails (leads, invoice questions, spam, a prompt-injection attempt) to test the Email agent."],
["setup",3,"What is a knowledge library (RAG) for a customer?","Their documents (price sheets, warranty terms, FAQs, service descriptions) stored so the agent can search and quote them. Lets agents answer accurately without stuffing everything into the prompt."],
["setup",3,"What is 'shadow mode'?","The agent runs on real data (once the customer authorizes it) and drafts everything into YOUR review system only; nothing is written to their mailbox or QuickBooks. You review the drafts before going live."],
["setup",3,"Your go-live checklist (short version)?","Profile approved by owner → connections working → sandbox tests pass → evals pass → shadow mode reviewed → owner trained on approving → kill switch tested → monitoring and alerts on → go live with one agent first."],
["setup",3,"Why go live one agent at a time?","Fewer moving parts, easier to spot problems, the owner learns gradually, and you get an early win to build trust before adding more."],
["setup",4,"What is a seed dataset for testing?","A set of realistic fake records you load into the sandbox: customers, jobs, estimates, paid/unpaid/overdue invoices, tricky edge cases (partial payments, retainage, duplicates)."],
["setup",4,"Why keep the profile structured, not just a paragraph?","Structured fields (payment_terms: 'Net 30', tone: 'friendly, short') are easy to validate, update and reuse across agents, and you can test that each rule is followed."],
["setup",4,"What happens when a customer's prices change?","Update the profile (versioned), re-run evals that touch pricing, and confirm with the owner. Agents should pull prices from QuickBooks items or the profile, never from old chat memory."],
["setup",5,"Moving from sandbox to production: what changes?","Production keys (after passing Intuit's production questionnaire and Google's app verification), real OAuth connections by the customer, production webhooks, real secrets in the secrets store, and stricter monitoring. Re-test the full flow once live, with the owner watching."],
["setup",5,"How do you hand off and document a customer setup?","A written setup doc per customer: tools connected, scopes, profile version, agents on, approval rules, alert contacts, known limits. It's your answer to 'what if you disappear?'."]
);

["invoicing",3,"q","Your client is in Oregon. Sales tax on your monthly dashboard service?",["About 8%, the typical state rate","None, Oregon has no sales tax","Your home state's rate applies","10%, the usual rate on software"],1,"Oregon has no general sales tax. Other states vary; check before billing out of state."],
["invoicing",3,"spot","Spot the mistake: a monthly service line that says just 'Dashboard service: $600'.",["Nothing, a flat monthly fee needs no detail","It's missing the service period and plan name","It should be broken into hourly charges","It should list the AI usage cost behind it"],1,"Recurring lines need the period (e.g., Dec 1–31, 2026) and plan name so the client knows exactly what month they're paying for."],
["invoicing",4,"q","$150,000 contract, 60% complete, 10% retainage, previously billed (net of retainage) $67,500. Current due?",["$13,500","$22,500","$81,000","$90,000"],0,"Earned $90,000 − retainage $9,000 = $81,000 − previous $67,500 = $13,500."],
["invoicing",4,"q","When should a contractor sign an UNCONDITIONAL lien waiver?",["When you send the final invoice","Once the client promises payment","After the payment has cleared","When the check arrives in the mail"],2,"Unconditional waives rights immediately, so only after the money is in."],
["invoicing",4,"drill","A GC's office says: 'We need it on a G702/G703.' Best answer?",["'Our QuickBooks invoices should cover the same info.'","'No problem. I'll bill on a G702 with the G703 breakdown.'","'Can your office fill that out from our invoice?'","'Sure, I'll attach a W-9 with our standard invoice.'"],1,"Know the forms big GCs use, and say yes confidently."],
["invoicing",5,"q","Client disputes one $1,200 line on a $14,800 invoice. Best handling?",["Void the whole invoice and reissue it once you both agree","Ask for the undisputed $13,600 now, then resolve the rest","Remove the $1,200 line so the relationship stays smooth","Wait until they're ready to pay the full $14,800 at once"],1,"Get paid for what's not in dispute, then document the rest."],
["invoicing",5,"q","A proposal says '3 custom reports included'. Client asks for a 4th. What protects you?",["A friendly email explaining you're fully booked","The signed scope, plus a change order for the 4th","Doing the 4th one free so they stay loyal and renew","The hourly rate posted on your website's pricing page"],1,"Written scope + change orders stop scope creep."],
["setup",1,"q","How does an agent 'know' a customer's prices and tone?",["The AI model is retrained on their past records","You give it their profile and connect their tools","It learns by reading their website and reviews","The customer explains it in each new request"],1,"No retraining: profile + live connections (+ a doc library if needed)."],
["setup",2,"q","Where should you test a new Invoicing agent first?",["On a real customer's books, watched closely","In a QuickBooks sandbox with fake data","In production late at night when it's quiet","On a family business's books as a trial run"],1,"Sandbox first, always."],
["setup",2,"q","Which belongs in the customer profile?",["Their QuickBooks login so it can connect","Payment terms, services, tone, approvals","Similar customers' prices for comparison","Your API key so the agent can run the model"],1,"Business rules go in the profile. Secrets never do."],
["setup",3,"q","The agent drafts real replies for a week but nobody sees them except you. That's…",["A soft launch","Shadow mode","A sandbox test","A pilot"],1,"Shadow mode: real-world quality check with zero risk."],
["setup",3,"q","Best first agent to take live for a new customer?",["All five at once for the biggest impact","The one tied to their biggest pain","The Email agent, since everyone uses email","Whichever agent is cheapest to run"],1,"One agent, biggest and most measurable pain, clear win."],
["setup",4,"spot","Spot the mistake: 'I'll keep one shared profile file and change the name at the top for each customer.'",["Fine, as long as you double-check the name before each run","Rules can leak between customers; keep one per customer","It should be a locked PDF so nobody edits it by accident","Names should stay out of profiles to protect privacy"],1,"Tenant isolation applies to profiles too: keep separate, versioned profiles."],
["setup",4,"q","A customer raises prices. Correct update flow?",["Tell the agent in chat so it remembers the new prices","Update the profile and QuickBooks items, re-test, confirm","Retrain the AI model on their new price list and invoices","Wait for the next monthly check-in to update everything"],1,"Change the source of truth (versioned profile, QuickBooks items), re-run pricing evals, confirm with the owner."],
["setup",5,"q","Moving from sandbox to production, which is NOT needed?",["Production app keys and settings","Customer connects their real accounts via OAuth","Copying sandbox test invoices into real books","Re-testing the full flow live with the owner"],2,"Fake sandbox data never goes into real books."]
);

EXPLAIN.push(
{t:"process",lv:2,q:"Walk through your whole sales process from first contact to getting paid.",pts:[["Find leads / first contact",["lead","reach out","contact","message","call"]],["Discovery (ask questions)",["discovery","question","learn","pain"]],["Demo",["demo","show"]],["Proposal",["proposal","quote"]],["Close",["close","sign","agreement","yes"]],["Onboarding / setup",["onboard","setup","set up","connect","sandbox"]],["Invoice / payment",["invoice","deposit","paid","payment"]],["Keep + upsell/referrals",["upsell","referr","check in","keep","retain"]]],model:"I find leads through people I know in construction and reach out for a short call. On the call I ask questions to find their biggest pains and put numbers on them. Then I demo the fix with sandbox data, send a proposal with exact scope and price, handle concerns, and ask for the start date. After they sign and pay the deposit, I onboard them: profile, connections, sandbox tests, go live. I invoice the rest at go-live, then the monthly fee, and check in monthly to show results, upsell and ask for referrals."},
{t:"process",lv:3,q:"Pretend I'm a contractor. Close me after a good demo.",pts:[["Recap their pain + value",["you said","you mentioned","late","estimate","hours"]],["Specific offer",["pilot","invoicing","agent","start"]],["Specific next step / date",["monday","tuesday","15th","next week","date","start on"]],["Ask, then stop",["want to","should we","sound good","ready"]]],model:"You said about $30k is sitting in late invoices and you're doing billing at night. Let's fix that first: Invoicing agent pilot, setup and first month, live in about two weeks. I can send the agreement today so we start on the 15th. Want to do that?"},
{t:"invoicing",lv:2,q:"Explain what goes on a professional invoice and why each part matters.",pts:[["Business + client details",["name","address","contact","client"]],["Invoice number",["number"]],["Dates and terms",["date","due","net","terms"]],["Itemized lines",["item","line","quantity","rate"]],["Subtotal/tax/total/balance",["subtotal","tax","total","balance"]],["How to pay",["pay","ach","card","check","bank"]]],model:"Both businesses' names and contact info so it's clearly from me to them, a unique invoice number for tracking, the invoice date and due date or terms so they know when to pay, itemized lines with quantity, rate and amount so they can approve it fast, then subtotal, tax, total and balance due after deposits, and clear payment instructions."},
{t:"invoicing",lv:4,q:"Explain progress billing with retainage to a new contractor customer.",pts:[["Bill by % complete",["percent","complete","progress","stage"]],["Retainage held back",["retainage","held","hold back","withheld"]],["Subtract previous billing",["previous","already billed","prior"]],["Retainage billed at the end",["end","final","completion","release"]]],model:"On big jobs you bill as work progresses: contract amount times percent complete. The client holds back a percentage, usually 5 to 10, as retainage. Subtract what you already billed, and that's this period's amount. When the job's done, you bill the retainage that was held back."},
{t:"setup",lv:2,q:"Explain to a customer how your agents learn their business.",pts:[["No retraining of the AI",["not train","no train","doesn't change","not retrain"]],["Profile from intake",["profile","intake","questionnaire","prices","terms"]],["Connections to their tools",["connect","quickbooks","email"]],["Owner approves profile",["approve","review","check"]]],model:"The AI isn't retrained on your business. Instead, we fill out an intake together: your services, prices, terms, tone and rules. That becomes your business profile, which the agents read every time they work, and they connect to your QuickBooks and email for live numbers. You review the profile before anything goes live."},
{t:"setup",lv:3,q:"Explain your sandbox-to-go-live process.",pts:[["Build in sandbox with fake data",["sandbox","fake","test"]],["Evals / test cases",["eval","test case","edge case"]],["Shadow mode on real data",["shadow"]],["Owner training + kill switch",["train","approve","kill","pause"]],["Go live one agent, monitor",["one agent","monitor","alert","watch"]]],model:"I build and test everything in a sandbox with fake QuickBooks and email data, including tricky cases. Then I run my test set. Next, shadow mode: the agent drafts on real data but only I see it. Once it's good, I train the owner on approving and test the kill switch, then go live with one agent and monitor closely."},
{t:"invoicing",lv:5,q:"Walk through a formal proposal for a $40,000 implementation for a large GC.",pts:[["Their problem in their words",["problem","you said","pain","goal"]],["Scope + exclusions",["scope","include","exclu"]],["Phases/timeline/deliverables",["phase","timeline","week","deliverable"]],["Itemized price + payment schedule",["itemiz","price","deposit","milestone","schedule"]],["Terms, assumptions, expiry, signature",["terms","assumption","expir","sign"]]],model:"It opens with their goals in their words. Then scope: what's included and, explicitly, what's not. Phases with deliverables and dates. An itemized price for each phase and the monthly service, with a payment schedule tied to milestones, like 40% at signing, 40% at sandbox sign-off, 20% at go-live. Then assumptions, a reference to the master agreement, an expiry date and a signature block."}
);
